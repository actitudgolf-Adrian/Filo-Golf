function StatCard({label,value,sub}){
  return(
    <div style={{...S.card,textAlign:"center",padding:"14px"}}>

      {sub&&<div style={{color:"#b09050",fontSize:"10px",marginTop:"3px"}}>{sub}</div>}
    </div>
  );
}

function calcStats(rounds){
  if(!rounds.length)return null;
  const n=rounds.length;
  const totalHoles=rounds.reduce((s,r)=>s+Object.keys(r.holes||{}).length,0);
  const avgGross=(rounds.reduce((s,r)=>s+(r.totalShots||0),0)/n).toFixed(1);
  const avgNeto=(rounds.reduce((s,r)=>s+((r.totalShots||0)-(r.hcp||0)),0)/n).toFixed(1);
  const best=Math.min(...rounds.map(r=>r.totalShots||999));
  const bestNeto=Math.min(...rounds.map(r=>(r.totalShots||0)-(r.hcp||0)));
  const totalPutts=rounds.reduce((s,r)=>s+(r.totalPutts||0),0);
  const totalChips=rounds.reduce((s,r)=>s+(r.totalChips||0),0);
  const totalBunker=rounds.reduce((s,r)=>s+(r.totalBunker||0),0);
  const avgPutts=(totalPutts/n).toFixed(1);
  const avgPuttsH=totalHoles?(totalPutts/totalHoles).toFixed(2):"—";
  const avgChips=(totalChips/n).toFixed(1);
  const avgChipsH=totalHoles?(totalChips/totalHoles).toFixed(2):"—";
  const avgBunker=(totalBunker/n).toFixed(1);
  const avgBunkerH=totalHoles?(totalBunker/totalHoles).toFixed(2):"—";
  return{n,avgGross,avgNeto,best,bestNeto,avgPutts,avgPuttsH,avgChips,avgChipsH,avgBunker,avgBunkerH};
}

function Auth({onLogin}){
  const [mode,setMode]=useState("login");
  const [f,setF]=useState({user:"",pass:"",code:"",name:"",hcp:"18",hcpT:"libre"});
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const upd=(k,v)=>setF(p=>({...p,[k]:v}));

  async function login(){
    setErr("");setBusy(true);
    try{
      const u=f.user.trim().toLowerCase();
      if(u===COACH_U&&f.pass===COACH_P){
        const c={username:"coach",name:"Adrián Mamianetti",isCoach:true};
        lsSet("session",c);onLogin(c);return;
      }
      const rows=await sbQ(`users?username=eq.${u}&limit=1`);
      const sb=rows&&rows[0];
      const local=lsGet("user:"+u);
      const s=sb||local;
      if(!s){setErr("Usuario no encontrado.");return}
      const pass=lsGet("pass:"+u)||s.pass;
      if(pass!==f.pass){setErr("Contraseña incorrecta.");return}
      const ud={username:s.username,name:s.name,hcp:s.hcp||18,hcpT:s.hcpt||s.hcpT||"libre",isCoach:false};
      lsSet("session",ud);lsSet("pass:"+u,f.pass);onLogin(ud);
    }catch(e){setErr("Error de conexión.");}
    finally{setBusy(false);}
  }

  async function register(){
    setErr("");setBusy(true);
    try{
      if(f.code.trim().toUpperCase()!==INVITE){setErr("Código de invitación inválido.");return}
      if(!f.user.trim()||!f.pass||!f.name.trim()){setErr("Completá todos los campos.");return}
      const u=f.user.trim().toLowerCase().replace(/\s/g,"");
      if(u===COACH_U){setErr("Ese usuario no está disponible.");return}
      const exists=await sbQ(`users?username=eq.${u}&limit=1`);
      if((exists&&exists.length)||lsGet("user:"+u)){setErr("Ese usuario ya existe.");return}
      const hcp=parseFloat(f.hcp)||18;
      const ud={username:u,name:f.name.trim(),hcp:hcp,hcpT:f.hcpT,isCoach:false};
      await sbU("users",{username:u,name:ud.name,hcp:hcp,hcpt:f.hcpT,joined_at:Date.now()});
      lsSet("user:"+u,{...ud,pass:f.pass});
      lsSet("pass:"+u,f.pass);
      lsSet("session",ud);onLogin(ud);
    }catch(e){setErr("Error inesperado.");}
    finally{setBusy(false);}
  }

  return(
    <div style={{...S.app,display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}>
      <div style={{width:"100%",maxWidth:"360px",padding:"24px 14px"}}>
        <div style={{textAlign:"center",marginBottom:"28px"}}>
          <div style={{fontSize:"52px",color:gold}}>φ</div>
          <div style={{fontSize:"13px",letterSpacing:"4px",color:gold,textTransform:"uppercase"}}>Filo Golf</div>
          <div style={{fontSize:"9px",color:"#b09050",letterSpacing:"2px",marginTop:"3px"}}>por Filo Coach</div>
        </div>
        <div style={S.card}>
          <div style={{display:"flex",gap:"8px",marginBottom:"16px"}}>
            {[["login","Ingresar"],["register","Registrarse"]].map(([m,l])=>(
              <button key={m} style={{...S.nb(mode===m),flex:1}} onClick={()=>{setMode(m);setErr("")}}>{l}</button>
            ))}
          </div>
          {err&&<div style={S.alt("e")}>{err}</div>}
          {mode==="register"&&<>
            <label style={S.lbl}>Código de invitación</label>
            <input style={{...S.inp,marginBottom:"10px"}} placeholder="Código de tu coach" value={f.code} onChange={e=>upd("code",e.target.value)}/>
            <label style={S.lbl}>Nombre completo</label>
            <input style={{...S.inp,marginBottom:"10px"}} placeholder="Nombre y apellido" value={f.name} onChange={e=>upd("name",e.target.value)}/>
          </>}
          <label style={S.lbl}>Usuario</label>
          <input style={{...S.inp,marginBottom:"10px"}} placeholder="sin espacios ni mayúsculas" value={f.user} onChange={e=>upd("user",e.target.value)}/>
          <label style={S.lbl}>Contraseña</label>
          <input style={{...S.inp,marginBottom:"10px"}} type="password" value={f.pass} onChange={e=>upd("pass",e.target.value)}/>
          {mode==="register"&&(
            <div style={{...S.g2,marginBottom:"10px"}}>
              <div><label style={S.lbl}>Handicap</label><input style={S.inp} type="number" min="0" max="54" value={f.hcp} onChange={e=>upd("hcp",e.target.value)}/></div>
              <div><label style={S.lbl}>Tipo</label>
                <select style={S.sel} value={f.hcpT} onChange={e=>upd("hcpT",e.target.value)}>
                  <option value="libre">Libre</option>
                  <option value="aag">Oficial AAG</option>
                </select>
              </div>
            </div>
          )}
          <button style={{...S.btn("p"),width:"100%",padding:"12px",fontSize:"14px",marginTop:"4px"}} onClick={mode==="login"?login:register} disabled={busy}>
            {busy?"Un momento...":(mode==="login"?"Ingresar":"Crear cuenta")}
          </button>
          {mode==="register"&&<div style={{marginTop:"10px",fontSize:"10px",color:"#b09050",textAlign:"center"}}>El código te lo da tu coach Adrián.</div>}
        </div>
      </div>
    </div>
  );
}

  const [step,setStep]=useState(1);
  const [meta,setMeta]=useState({courseId:"",date:new Date().toISOString().slice(0,10),format:"Strokeplay",hcp:user.hcp||18,hcpT:user.hcpT||"libre",numHoles:18,savedConfig:""});
  const [holes,setHoles]=useState({});
  const [err,setErr]=useState("");
  const [saving,setSaving]=useState(false);
  const [savedConfigs,setSavedConfigs]=useState(()=>lsGet("configs:"+user.username)||{});
  const [showSaveCfg,setShowSaveCfg]=useState(false);
  const [cfgName,setCfgName]=useState("");
  const course=COURSES.find(c=>c.id===meta.courseId);
  const holeCount=parseInt(meta.numHoles)||18;
  const totalShots=Object.values(holes).reduce((s,h)=>s+(parseInt(h.shots)||0),0);
  const totalPutts=Object.values(holes).reduce((s,h)=>s+(parseInt(h.putts)||0),0);
  const totalChips=Object.values(holes).reduce((s,h)=>s+(parseInt(h.chips)||0),0);
  const totalBunker=Object.values(holes).reduce((s,h)=>s+(parseInt(h.bunker)||0),0);
  const hasDist=Object.values(holes).some(h=>h.dist);
  const configsForCourse=Object.keys(savedConfigs).filter(k=>k.startsWith(meta.courseId+"|"));

  async function save(){
    if(!meta.courseId){setErr("Seleccioná una cancha.");return}
    setSaving(true);
    try{
      const id=Date.now().toString();
      const round={id,username:user.username,playerName:user.name,courseId:meta.courseId,courseName:course?.name,date:meta.date,format:meta.format,hcp:parseFloat(meta.hcp)||0,hcpT:meta.hcpT,numHoles:holeCount,holes,totalShots,totalPutts,totalChips,totalBunker,createdAt:Date.now()};
      lsSet("round:"+id,round);
      const idx=lsGet("rounds:"+user.username)||[];idx.push(id);lsSet("rounds:"+user.username,idx);
      // Mark as pending sync
      const pending=lsGet("pending:"+user.username)||[];pending.push(id);lsSet("pending:"+user.username,pending);
      // Try to sync now
      const ok=await sbU("rounds",{id,username:user.username,player_name:user.name,course_id:meta.courseId,course_name:course?.name,date:meta.date,format:meta.format,hcp:parseFloat(meta.hcp)||0,hcpt:meta.hcpT,num_holes:holeCount,holes,total_shots:totalShots,total_putts:totalPutts,total_chips:totalChips,total_bunker:totalBunker,created_at:Date.now()});
      if(ok){const p=lsGet("pending:"+user.username)||[];lsSet("pending:"+user.username,p.filter(x=>x!==id));}
      onSave();
    }catch(e){setErr("Error al guardar. Intentá de nuevo.");}
    finally{setSaving(false);}
  }

  function saveConfig(){
    if(!cfgName.trim())return;
    const key=meta.courseId+"|"+Date.now();
    const holesOnly={};
    Object.entries(holes).forEach(([h,d])=>{holesOnly[h]={par:d.par,dist:d.dist}});
    const configs=lsGet("configs:"+user.username)||{};
    configs[key]={name:cfgName.trim(),courseId:meta.courseId,holes:holesOnly,savedAt:Date.now()};
    lsSet("configs:"+user.username,configs);setSavedConfigs(configs);setShowSaveCfg(false);
    alert("✓ Configuración guardada: "+cfgName.trim());
  }

      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px"}}>

            {COURSES.map(c=><option key={c.id} value={c.id}>{c.name} — {c.city}</option>)}
          </select>
          {meta.courseId&&configsForCourse.length>0&&(

              <label style={S.lbl}>Configuración guardada (opcional)</label>
              <select style={S.sel} value={meta.savedConfig||""} onChange={e=>{
                const cfg=savedConfigs[e.target.value];
                if(cfg){
                  const newH={};
                  Object.entries(cfg.holes||{}).forEach(([h,d])=>{newH[h]={...d,shots:"",putts:"",chips:0,bunker:0,yards:"",salida:"",zones:{},note:""}});
                  setHoles(newH);setMeta(m=>({...m,savedConfig:e.target.value,numHoles:Object.keys(cfg.holes||{}).length}));
                }else{setMeta(m=>({...m,savedConfig:""}));}

            </div>

function MyRounds({user}){
  const [rounds,setRounds]=useState([]);
  const [selected,setSelected]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{loadRounds();},[]);

  async function syncPending(){
    const pending=lsGet("pending:"+user.username)||[];
    if(!pending.length)return;
    const synced=[];
    for(const id of pending){
      const r=lsGet("round:"+id);
      if(!r)continue;
      const ok=await sbU("rounds",{id,username:r.username,player_name:r.playerName,course_id:r.courseId,course_name:r.courseName,date:r.date,format:r.format,hcp:r.hcp||0,hcpt:r.hcpT,num_holes:r.numHoles||18,holes:r.holes,total_shots:r.totalShots||0,total_putts:r.totalPutts||0,total_chips:r.totalChips||0,total_bunker:r.totalBunker||0,created_at:r.createdAt||Date.now()});
      if(ok)synced.push(id);
    }
    if(synced.length){
      const remaining=pending.filter(id=>!synced.includes(id));
      lsSet("pending:"+user.username,remaining);
    }
    return synced.length;
  }

  async function loadRounds(){
    setLoading(true);
    // First sync any pending local rounds
    await syncPending();
    try{
      const sb=await sbQ(`rounds?username=eq.${user.username}&order=created_at.desc`);
      if(sb&&sb.length){
        // Also merge any local rounds not yet in Supabase
        const sbIds=new Set(sb.map(r=>r.id));
        const localIdx=lsGet("rounds:"+user.username)||[];
        const localOnly=localIdx.map(id=>lsGet("round:"+id)).filter(r=>r&&!sbIds.has(r.id));
        setRounds([...sb,...localOnly].sort((a,b)=>(b.created_at||b.createdAt||0)-(a.created_at||a.createdAt||0)));
      }else{
        const idx=lsGet("rounds:"+user.username)||[];
        const loaded=idx.map(id=>lsGet("round:"+id)).filter(Boolean);
        loaded.sort((a,b)=>b.createdAt-a.createdAt);
        setRounds(loaded);
      }
    }catch{
      const idx=lsGet("rounds:"+user.username)||[];
      setRounds(idx.map(id=>lsGet("round:"+id)).filter(Boolean));
    }
    setLoading(false);
  }

  if(selected)return <RoundDetail round={selected} onBack={()=>setSelected(null)}/>;

  const getShots=r=>r.totalShots||r.total_shots||0;
  const getPutts=r=>r.totalPutts||r.total_putts||0;
  const getChips=r=>r.totalChips||r.total_chips||0;
  const getHcp=r=>r.hcp||0;
  const getHoles=r=>r.numHoles||r.num_holes||18;
  const getName=r=>r.courseName||r.course_name||"";

  return(
    <div style={S.page}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
        <div style={S.h2}>Mis Vueltas</div>
        <button style={{...S.btn("g"),fontSize:"11px",padding:"7px 12px"}} onClick={loadRounds}>⟳ Actualizar</button>
      </div>
      {(lsGet("pending:"+user.username)||[]).length>0&&(
        <div style={{...S.alt("e"),fontSize:"12px"}}>
          ⚠️ Tenés {(lsGet("pending:"+user.username)||[]).length} vuelta(s) sin sincronizar. Tocá "Actualizar" cuando tengas conexión.
        </div>
      )}
      {loading&&<div style={{color:"#b09050",textAlign:"center",padding:"20px"}}>Cargando...</div>}
      {!loading&&rounds.length===0&&(
        <div style={{...S.card,textAlign:"center",color:"#b09050",padding:"40px 20px"}}>
          <div style={{fontSize:"32px",marginBottom:"10px"}}>⛳</div>
          <div>Todavía no registraste ninguna vuelta.</div>
        </div>
      )}
      {rounds.map(r=>(
        <div key={r.id} style={{...S.card,cursor:"pointer"}} onClick={()=>setSelected(r)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{color:"#f5ead0",fontWeight:"bold",marginBottom:"3px"}}>{getName(r)}</div>
              <div style={{color:"#b09050",fontSize:"11px"}}>{r.date} · {r.format} · {getHoles(r)} hoyos</div>
              <div style={{color:"#b09050",fontSize:"11px"}}>HCP {getHcp(r)} ({r.hcpT||r.hcpt||"libre"})</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{color:gold,fontSize:"22px",fontWeight:"bold"}}>{getShots(r)}</div>
              <div style={{color:"#b09050",fontSize:"11px"}}>{getPutts(r)} putts · {getChips(r)} chips</div>
              <div style={{color:"#b09050",fontSize:"11px"}}>Neto: {getShots(r)-getHcp(r)}</div>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

    setLoading(true);
    try{
      const sbRounds=await sbQ("rounds?order=created_at.desc");
      const sbUsers=await sbQ("users");
      const userMap={};
      (sbUsers||[]).forEach(u=>{userMap[u.username]={username:u.username,name:u.name,hcp:u.hcp||18,hcpT:u.hcpt||"libre",notas:u.notas||{}}});
      const byPlayer={};
      (sbRounds||[]).forEach(r=>{
        if(!byPlayer[r.username])byPlayer[r.username]={user:userMap[r.username]||{username:r.username,name:r.player_name,hcp:r.hcp||18},rounds:[]};
        byPlayer[r.username].rounds.push(r);
      });
      const result=Object.values(byPlayer);
      setPlayers(result.length?result:lsGet("coach:players")||[]);
    }catch{setPlayers(lsGet("coach:players")||[]);}
    finally{setLoading(false);}
  }

  function allRounds(){return players.flatMap(p=>p.rounds).sort((a,b)=>(b.created_at||b.createdAt||0)-(a.created_at||a.createdAt||0))}

  function ranking(){
    const pl={};
    players.forEach(pkg=>{
      const u=pkg.user;if(!u)return;
      const shots=pkg.rounds.reduce((s,r)=>s+(r.total_shots||r.totalShots||0),0);
      pl[u.username]={name:u.name,hcp:u.hcp,rounds:pkg.rounds,shots};
    });
    return Object.values(pl).filter(p=>p.rounds.length).sort((a,b)=>(a.shots/a.rounds.length)-(b.shots/b.rounds.length));
  }

  if(selRound)return <RoundDetail round={selRound} onBack={()=>setSelRound(null)} coachView/>;
  const rank=ranking();

  return(
    <div style={S.page}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
        <div style={S.h2}>Panel Coach</div>
        <button style={{...S.btn("g"),fontSize:"11px",padding:"6px 10px"}} onClick={loadAll}>{loading?"⟳...":"⟳ Actualizar"}</button>
      </div>
      <div style={{display:"flex",gap:"5px",flexWrap:"wrap",marginBottom:"16px"}}>
        {[["ranking","Ranking"],["players","Jugadores"],["rounds","Vueltas"]].map(([t,l])=>(
          <button key={t} style={S.nb(tab===t)} onClick={()=>{setTab(t);setSelPlayer(null);setSelPlayerTab("vueltas")}}>{l}</button>
        ))}
      </div>
      {loading&&<div style={{color:"#b09050",padding:"20px",textAlign:"center"}}>Cargando datos...</div>}

      {tab==="ranking"&&!loading&&(
        rank.length===0
          ?<div style={{...S.card,color:"#b09050",textAlign:"center",padding:"36px"}}>No hay datos aún.</div>
          :rank.map((p,i)=>{
            const avgGross=(p.shots/p.rounds.length).toFixed(1);
            const netoShots=p.rounds.reduce((s,r)=>s+((r.total_shots||r.totalShots||0)-(r.hcp||0)),0);
            const avgNeto=(netoShots/p.rounds.length).toFixed(1);
            const best=Math.min(...p.rounds.map(r=>r.total_shots||r.totalShots||999));
            const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"";
            return(
              <div key={p.name} style={{...S.card,display:"flex",alignItems:"center",gap:"12px",padding:"12px 14px"}}>
                <div style={{fontSize:"18px",minWidth:"26px",textAlign:"center"}}>{medal||<span style={{color:"#b09050",fontSize:"12px",fontWeight:"bold"}}>#{i+1}</span>}</div>
                <div style={{flex:1}}>
                  <div style={{color:"#f5ead0",fontWeight:"bold",fontSize:"13px"}}>{p.name}</div>
                  <div style={{color:"#b09050",fontSize:"10px"}}>{getCat(p.hcp)} · HCP {p.hcp} · {p.rounds.length} vuelta{p.rounds.length!==1?"s":""}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{color:gold,fontSize:"17px",fontWeight:"bold"}}>{avgGross} <span style={{fontSize:"11px",color:"#b09050"}}>gross</span></div>
                  <div style={{color:"#b09050",fontSize:"13px",fontWeight:"bold"}}>{avgNeto} <span style={{fontSize:"10px"}}>neto</span></div>
                  <div style={{color:"#b09050",fontSize:"10px"}}>mejor: {best===999?"—":best}</div>
                </div>
              </div>
            );
          })
      )}

      {tab==="players"&&!loading&&!selPlayer&&(
        players.length===0
          ?<div style={{...S.card,color:"#b09050",textAlign:"center",padding:"36px"}}>No hay alumnos aún.</div>
          :players.map(pkg=>{
            const p=pkg.user,rs=pkg.rounds;
            const avg=rs.length?(rs.reduce((s,r)=>s+(r.total_shots||r.totalShots||0),0)/rs.length).toFixed(1):"—";
            return(
              <div key={p.username} style={{...S.card,cursor:"pointer"}} onClick={()=>{setSelPlayer(pkg);setSelPlayerTab("vueltas")}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{color:"#f5ead0",fontWeight:"bold"}}>{p.name}</div>
                    <div style={{color:"#b09050",fontSize:"11px"}}>{getCat(p.hcp)} · HCP {p.hcp} · {rs.length} vuelta{rs.length!==1?"s":""}</div>
                  </div>
                  <div style={{color:gold,fontSize:"19px",fontWeight:"bold"}}>{avg}</div>
                </div>
              </div>
            );
          })
      )}

      {tab==="players"&&selPlayer&&(
        <>
          <button style={{...S.btn("g"),marginBottom:"12px"}} onClick={()=>setSelPlayer(null)}>← Jugadores</button>
          <div style={{color:gold,fontSize:"15px",fontWeight:"bold",marginBottom:"4px"}}>{selPlayer.user.name}</div>
          <div style={{color:"#b09050",fontSize:"11px",marginBottom:"14px"}}>HCP {selPlayer.user.hcp} · {getCat(selPlayer.user.hcp)}</div>
          <div style={{display:"flex",gap:"5px",flexWrap:"wrap",marginBottom:"14px"}}>
            {[["vueltas","Vueltas"],["stats","Estadísticas"],["notas","Notas y Canchas"]].map(([t,l])=>(
              <button key={t} style={{...S.nb(selPlayerTab===t),flex:1}} onClick={()=>setSelPlayerTab(t)}>{l}</button>
            ))}
          </div>
          {selPlayerTab==="stats"&&(()=>{
            const rounds=selPlayer.rounds.map(r=>({id:r.id,totalShots:r.total_shots||r.totalShots||0,totalPutts:r.total_putts||r.totalPutts||0,totalChips:r.total_chips||r.totalChips||0,totalBunker:r.total_bunker||r.totalBunker||0,hcp:r.hcp||0,holes:r.holes||{}}));
            return <StatsView rounds={rounds} hcp={selPlayer.user.hcp} isCoach={true}/>;
          })()}
          {selPlayerTab==="notas"&&(
            <div style={S.card}>
              <div style={{color:gold,fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"12px"}}>Notas mentales</div>
              {(()=>{
                const notas=selPlayer.user.notas||{};
                const tieneNotas=Object.values(notas).some(Boolean);
                if(!tieneNotas)return <div style={{color:"#b09050",fontSize:"13px",marginBottom:"14px"}}>Sin notas mentales cargadas.</div>;
                return [...ZONES,"Nota general"].map(z=>notas[z]&&(
                  <div key={z} style={{marginBottom:"12px"}}>
                    <div style={{color:"#b09050",fontSize:"10px",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px"}}>{z}</div>
                    <div style={{color:"#f5ead0",fontSize:"13px",background:"#141210",padding:"10px",borderRadius:"4px",border:"1px solid #5a4a20"}}>{notas[z]}</div>
                  </div>
                ));
              })()}
              <div style={{borderTop:"1px solid #5a4a20",marginTop:"14px",paddingTop:"14px"}}>
                <div style={{color:gold,fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"8px"}}>Configuraciones de cancha</div>
                {(()=>{
                  const cfgs=lsGet("configs:"+selPlayer.user.username)||{};
                  const keys=Object.keys(cfgs);
                  if(!keys.length)return <div style={{color:"#b09050",fontSize:"13px"}}>Sin configuraciones guardadas.</div>;
                  return keys.map(k=>{
                    const cfg=cfgs[k];const course=COURSES.find(c=>c.id===cfg.courseId);
                    return(<div key={k} style={{padding:"8px 0",borderBottom:"1px solid #3a3020"}}><div style={{color:"#f5ead0",fontSize:"13px"}}>{cfg.name}</div><div style={{color:"#b09050",fontSize:"10px"}}>{course?.name||cfg.courseId} · {Object.keys(cfg.holes||{}).length} hoyos</div></div>);
                  });
                })()}
              </div>
            </div>
          )}
          {selPlayerTab==="vueltas"&&(
            <div style={S.card}>
              {selPlayer.rounds.length===0&&<div style={{color:"#b09050"}}>Sin vueltas registradas.</div>}
              {selPlayer.rounds.map(r=>(
                <div key={r.id} style={{cursor:"pointer",padding:"9px 0",borderBottom:"1px solid #3a3020",display:"flex",justifyContent:"space-between",alignItems:"center"}} onClick={()=>setSelRound(r)}>
                  <div>
                    <div style={{color:"#f5ead0",fontSize:"13px"}}>{r.course_name||r.courseName}</div>
                    <div style={{color:"#b09050",fontSize:"10px"}}>{r.date} · {r.format} · {r.num_holes||r.numHoles||18} hoyos</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{color:gold,fontSize:"18px",fontWeight:"bold"}}>{r.total_shots||r.totalShots}</div>
                    <div style={{color:"#b09050",fontSize:"10px"}}>Neto: {(r.total_shots||r.totalShots||0)-(r.hcp||0)}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {tab==="rounds"&&!loading&&(
        allRounds().length===0
          ?<div style={{...S.card,color:"#b09050",textAlign:"center",padding:"36px"}}>No hay vueltas aún.</div>
          :allRounds().map(r=>(
            <div key={r.id} style={{...S.card,cursor:"pointer"}} onClick={()=>setSelRound(r)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{color:"#f5ead0",fontWeight:"bold"}}>{r.player_name||r.playerName}</div>
                  <div style={{color:"#b09050",fontSize:"11px"}}>{r.course_name||r.courseName} · {r.date} · {r.num_holes||r.numHoles||18} hoyos</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{color:gold,fontSize:"20px",fontWeight:"bold"}}>{r.total_shots||r.totalShots}</div>
                  <div style={{color:"#b09050",fontSize:"10px"}}>Neto: {(r.total_shots||r.totalShots||0)-(r.hcp||0)}</div>
                </div>
              </div>
            </div>
          ))
      )}
    </div>
  );
}

function App(){
  const [user,setUser]=useState(()=>lsGet("session"));
  const [tab,setTab]=useState("stats");
  const [newRound,setNR]=useState(false);

  if(!user)return <Auth onLogin={u=>{lsSet("session",u);setUser(u)}}/>;

  const nav=user.isCoach
    ?[["stats","Inicio"],["coach","Coach"],["ronda","+ Vuelta"]]
    :[["stats","Mis Stats"],["myrounds","Mis Vueltas"],["ronda","+ Vuelta"],["profile","Perfil"]];

  function go(t){if(t==="ronda"){setNR(true);return}setNR(false);setTab(t)}

  return(
    <div style={S.app}>
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"center"}}>
          <div style={{fontSize:"26px",color:gold,marginRight:"8px"}}>φ</div>
          <div>
            <div style={{fontSize:"12px",letterSpacing:"3px",color:gold,textTransform:"uppercase"}}>Filo Golf</div>
            <div style={{fontSize:"9px",color:"#b09050",letterSpacing:"2px"}}>por Filo Coach</div>
          </div>
        </div>
        <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
          {nav.map(([t,l])=>(
            <button key={t} style={S.nb(!newRound&&tab===t||newRound&&t==="ronda")} onClick={()=>go(t)}>{l}</button>
          ))}
          <button style={{...S.btn("g"),fontSize:"10px",padding:"5px 9px"}} onClick={()=>{lsSet("session",null);setUser(null)}}>Salir</button>
        </div>
      </div>
      {newRound
        ?<NewRound user={user} onSave={()=>{setNR(false);setTab("myrounds")}} onCancel={()=>setNR(false)}/>
        :tab==="stats"?<Stats user={user}/>
        :tab==="myrounds"?<MyRounds user={user}/>
        :tab==="coach"&&user.isCoach?<CoachPanel/>
        :tab==="profile"?<Profile user={user} onUpdate={u=>setUser(u)}/>
        :null
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
