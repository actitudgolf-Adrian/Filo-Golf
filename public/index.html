          <button onClick={()=>setVerTarjeta(v=>!v)} style={{width:"100%",background:L?"#f0ebe0":"#1a1612",border:`1px solid ${cardBorder}`,borderRadius:"6px",padding:"10px 14px",color:L?"#6a4a1a":gold,fontSize:"12px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",fontWeight:"bold",letterSpacing:"0.5px"}}>
            <span>📋 Tarjeta de la cancha</span>
            <span style={{fontSize:"14px"}}>{verTarjeta?"▲":"▼"}</span>
          </button>
          {verTarjeta&&(()=>{
            const holes=j.holes||{};
            const numHoles=clase.numHoles||9;
            const holeNums=Array.from({length:numHoles},(_,i)=>i+1);
            const totalShots=holeNums.reduce((s,h)=>s+(parseInt((holes[h]||{}).shots)||0),0);
            const totalPutts=holeNums.reduce((s,h)=>s+(parseInt((holes[h]||{}).putts)||0),0);
            const totalChips=holeNums.reduce((s,h)=>s+(parseInt((holes[h]||{}).chips)||0),0);
            const totalBunker=holeNums.reduce((s,h)=>s+(parseInt((holes[h]||{}).bunker)||0),0);
            const totalPar=holeNums.reduce((s,h)=>s+(parseInt((holes[h]||{}).par)||0),0);
            const thT={background:L?"#e8dfc8":"#141210",color:L?"#6a4a1a":"#b09050",padding:"5px 7px",textAlign:"center",fontSize:"10px",letterSpacing:"0.5px",textTransform:"uppercase",borderBottom:`1px solid ${cardBorder}`,whiteSpace:"nowrap"};
            const tdT=(val,bold,color)=>({padding:"5px 7px",textAlign:"center",color:color||(L?"#2a1a08":"#f5ead0"),fontWeight:bold?"bold":"normal",fontSize:"12px",borderBottom:`1px solid ${L?"#e0d4b0":"#2a2218"}`,background:"transparent"});
            return(
              <div style={{border:`1px solid ${cardBorder}`,borderTop:"none",borderRadius:"0 0 6px 6px",overflowX:"auto",background:L?"#fff":"#1c1810"}}>
                <table style={{width:"100%",borderCollapse:"collapse",minWidth:`${numHoles*52+100}px`}}>
                  <thead>
                    <tr>
                      <th style={{...thT,textAlign:"left",minWidth:"60px"}}>Métrica</th>
                      {holeNums.map(h=><th key={h} style={thT}>{h}</th>)}
                      <th style={{...thT,color:L?"#C9A84C":gold}}>TOT</th>
                    </tr>
                  </thead>
                  <tbody>
                    {/* Par */}
                    <tr>
                      <td style={{...tdT(null,false,"#b09050"),textAlign:"left",fontSize:"10px",letterSpacing:"0.5px",textTransform:"uppercase"}}>Par</td>
                      {holeNums.map(h=>{const v=(holes[h]||{}).par;return <td key={h} style={tdT(v,false,L?"#7a5a20":"#b09050")}>{v||"—"}</td>;})}
                      <td style={{...tdT(totalPar,true,L?"#7a5a20":"#b09050")}}>{totalPar||"—"}</td>
                    </tr>
                    {/* Golpes */}
                    <tr>
                      <td style={{...tdT(null,false,L?"#2a1a08":"#f5ead0"),textAlign:"left",fontSize:"10px",letterSpacing:"0.5px",textTransform:"uppercase"}}>Golpes</td>
                      {holeNums.map(h=>{
                        const hd=holes[h]||{};
                        const s=parseInt(hd.shots)||0;
                        const p=parseInt(hd.par)||0;
                        const diff=s&&p?s-p:null;
                        const col=diff===null?(L?"#2a1a08":"#f5ead0"):diff<0?"#6abf6a":diff===0?(L?"#7a5a20":"#b09050"):"#cf6679";
                        return <td key={h} style={tdT(s||"—",true,col)}>{s||"—"}</td>;
                      })}
                      <td style={{...tdT(totalShots,true,L?"#C9A84C":gold)}}>{totalShots||"—"}</td>
                    </tr>
                    {/* Putts */}
                    <tr>
                      <td style={{...tdT(null,false,L?"#2a1a08":"#f5ead0"),textAlign:"left",fontSize:"10px",letterSpacing:"0.5px",textTransform:"uppercase"}}>Putts</td>
                      {holeNums.map(h=>{const v=parseInt((holes[h]||{}).putts)||0;return <td key={h} style={tdT(v||"—",false,v>=3?"#cf6679":v===1?"#6abf6a":null)}>{v||"—"}</td>;})}
                      <td style={tdT(totalPutts,true)}>{totalPutts||"—"}</td>
                    </tr>
                    {/* Chips — solo si hay alguno */}
                    {totalChips>0&&(
                      <tr>
                        <td style={{...tdT(null,false,L?"#2a1a08":"#f5ead0"),textAlign:"left",fontSize:"10px",letterSpacing:"0.5px",textTransform:"uppercase"}}>Chips</td>
                        {holeNums.map(h=>{const v=parseInt((holes[h]||{}).chips)||0;return <td key={h} style={tdT(v||"—")}>{v||"—"}</td>;})}
                        <td style={tdT(totalChips,true)}>{totalChips}</td>
                      </tr>
                    )}
                    {/* Búnker — solo si hay alguno */}
                    {totalBunker>0&&(
                      <tr>
                        <td style={{...tdT(null,false,L?"#2a1a08":"#f5ead0"),textAlign:"left",fontSize:"10px",letterSpacing:"0.5px",textTransform:"uppercase"}}>Búnker</td>
                        {holeNums.map(h=>{const v=parseInt((holes[h]||{}).bunker)||0;return <td key={h} style={tdT(v||"—")}>{v||"—"}</td>;})}
                        <td style={tdT(totalBunker,true)}>{totalBunker}</td>
                      </tr>
                    )}
                    {/* GAPI — primer tiro al green */}
                    <tr>
                      <td style={{...tdT(null,false,L?"#2a1a08":"#f5ead0"),textAlign:"left",fontSize:"10px",letterSpacing:"0.5px",textTransform:"uppercase"}}>1º tiro green</td>
                      {holeNums.map(h=>{
                        const hd=holes[h]||{};
                        if(!parseInt(hd.shots)||!Array.isArray(hd.tirosGreen)||!hd.tirosGreen.length)return <td key={h} style={tdT("—",false,L?"#c0a060":"#5a4a20")}>—</td>;
                        const t0=hd.tirosGreen[0];
                        const esGapi=t0.resultado==="green";
                        const dist=parseFloat(t0.dist)>0?t0.dist+"m":"";
                        return <td key={h} style={tdT(esGapi?"✓":"✗",true,esGapi?"#6abf6a":"#cf6679")} title={dist}>{esGapi?"✓":"✗"}{dist&&<span style={{fontSize:"9px",display:"block",color:L?"#7a5a20":"#b09050",fontWeight:"normal"}}>{dist}</span>}</td>;
                      })}
                      <td style={tdT(null,false,L?"#b09050":"#b09050")}> </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            );
          })()}
        </div>

        <div style={{display:"flex",gap:"8px"}}>
          <button style={{background:L?"#e8f0e0":"#182010",color:L?"#3a6010":"#a8d070",border:`2px solid ${L?"#6a9a30":"#4a7a18"}`,borderRadius:"4px",padding:"11px 15px",fontSize:"13px",cursor:"pointer",fontWeight:"bold",flex:1}} onClick={()=>previsualizarInforme(selJ)}>
            👁 Previsualizar Informe
          </button>
          <button style={{background:`linear-gradient(135deg,${gold},#a8822a)`,color:"#1a1612",border:"none",borderRadius:"4px",padding:"11px 15px",fontSize:"13px",cursor:"pointer",fontWeight:"bold",flex:1}} onClick={()=>descargarInforme(selJ)}>
            ↓ Descargar Informe
          </button>
        </div>
      </div>

      {previewHtml&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.85)",zIndex:9999,display:"flex",flexDirection:"column"}}>
          <div style={{background:"#1a1612",padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #5a4a20"}}>
            <span style={{color:gold,fontWeight:"bold",fontSize:"14px"}}>👁 Vista previa del informe</span>
            <div style={{display:"flex",gap:"8px"}}>
              <button style={{background:`linear-gradient(135deg,${gold},#a8822a)`,color:"#1a1612",border:"none",borderRadius:"4px",padding:"7px 14px",fontSize:"12px",cursor:"pointer",fontWeight:"bold"}} onClick={()=>{descargarInforme(selJ);setPreviewHtml(null);}}>↓ Descargar</button>
              <button style={{background:"#2d2720",color:"#f5ead0",border:"1px solid #5a4a20",borderRadius:"4px",padding:"7px 14px",fontSize:"12px",cursor:"pointer"}} onClick={()=>setPreviewHtml(null)}>✕ Cerrar</button>
            </div>
          </div>
          <iframe srcDoc={previewHtml} style={{flex:1,border:"none",background:"#fff"}} title="Vista previa informe"/>
        </div>
      )}
    </div>
  );
}

// ─── CLASE EN CANCHA ──────────────────────────────────────────────────────────
// ── Sync helpers para clases en cancha ──────────────────────────────────────
async function sbUpsertClase(clase){
  try{
    const payload={
      id:clase.id,
      coach_username:"coach",
      fecha:clase.fecha||"",
      data:clase,
      finalizada:!!clase.finalizada,
      created_at:clase.createdAt||Date.now()
    };
    const r=await fetch(SB_URL+"/rest/v1/clases",{
      method:"POST",
      headers:{...H,"Prefer":"resolution=merge-duplicates"},
      body:JSON.stringify(payload)
    });
    return r.ok;
  }catch{return false;}
}

async function sbLoadClases(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/clases?coach_username=eq.coach&order=created_at.desc",{headers:H});
    if(!r.ok)return null;
    const rows=await r.json();
    return rows.map(row=>row.data).filter(Boolean);
  }catch{return null;}
}
// ────────────────────────────────────────────────────────────────────────────

function ClaseStatsPanel({alumnos}){
  const [selAlumnoKey,setSelAlumnoKey]=useState(null);
  const finalizadas=alumnos.map(a=>({...a,clases:a.clases.filter(c=>c.finalizada&&!c.archivada).sort((x,y)=>x.createdAt-y.createdAt)})).filter(a=>a.clases.length);

  if(!finalizadas.length)return(
    <div style={{...S.card,color:"#b09050",textAlign:"center",padding:"36px"}}>
      <div style={{fontSize:"24px",marginBottom:"8px"}}>📊</div>
      <div>Todavía no hay clases finalizadas con estadísticas.</div>
    </div>
  );

  const selAlumno=selAlumnoKey?finalizadas.find(a=>`${a.apellido}|${a.nombre}`===selAlumnoKey):null;

  function calcClaseStats(cl,alumno){
    const j=cl.jugadores.find(j=>j.apellido===alumno.apellido&&j.nombre===alumno.nombre);
    if(!j)return null;
    const holesArr=Object.values(j.holes||{});
    const holesConGolpes=holesArr.filter(h=>parseInt(h.shots)>0);
    const n=holesConGolpes.length;
    if(!n)return null;
    const totalShots=holesConGolpes.reduce((s,h)=>s+(parseInt(h.shots)||0),0);
    const totalPutts=holesArr.reduce((s,h)=>s+(parseInt(h.putts)||0),0);
    const totalChips=holesArr.reduce((s,h)=>s+(parseInt(h.chips)||0),0);
    const totalBunker=holesArr.reduce((s,h)=>s+(parseInt(h.bunker)||0),0);
    const avgPuttsH=(totalPutts/n).toFixed(2);
    const avgChipsH=(totalChips/n).toFixed(2);
    const avgBunkerH=(totalBunker/n).toFixed(2);
    const dp1vals=holesArr.map(h=>parseFloat(h.distPutt1)).filter(v=>v>0);
    const avgDistPutt1=dp1vals.length?(dp1vals.reduce((a,b)=>a+b,0)/dp1vals.length).toFixed(1):null;
    const tirosGreen=holesArr.flatMap(h=>Array.isArray(h.tirosGreen)?h.tirosGreen:[]);
    // GAPI: solo primer tiro por hoyo
    const hoyosConTiro=holesArr.filter(h=>parseInt(h.shots)>0&&Array.isArray(h.tirosGreen)&&h.tirosGreen.length>0);
    const gapiHoyos=hoyosConTiro.filter(h=>h.tirosGreen[0].resultado==="green");
    const gapiN=gapiHoyos.length;
    const gapiTotal=hoyosConTiro.length;
    const gapiPct=gapiTotal>0?Math.round(gapiN/gapiTotal*100):null;
    const distTodoVals=hoyosConTiro.map(h=>parseFloat(h.tirosGreen[0].dist)).filter(v=>v>0);
    const avgDistTodo=distTodoVals.length?(distTodoVals.reduce((a,b)=>a+b,0)/distTodoVals.length).toFixed(1):null;
    const distGapiVals=gapiHoyos.map(h=>parseFloat(h.tirosGreen[0].dist)).filter(v=>v>0);
    const avgDistGapi=distGapiVals.length?(distGapiVals.reduce((a,b)=>a+b,0)/distGapiVals.length).toFixed(1):null;
    const parTotal=holesConGolpes.reduce((s,h)=>s+(parseInt(h.par)||0),0);
    const neto=parTotal>0?totalShots-parTotal:null;
    return{n,totalShots,totalPutts,totalChips,totalBunker,avgPuttsH,avgChipsH,avgBunkerH,avgDistPutt1,gapiN,gapiTotal,gapiPct,avgDistTodo,avgDistGapi,neto,parTotal,j};
  }

  function numAvg(arr){return arr.length?(arr.reduce((a,b)=>a+b,0)/arr.length):null;}
  function fmtAvg(v,dec){return v!==null?v.toFixed(dec):"—";}
  function fmtNeto(v){if(v===null)return"—";const r=typeof v==="number"&&!Number.isInteger(v)?v.toFixed(1):v;return(v>0?"+":"")+r;}

  const COLS=[
    {key:"fecha",   label:"Fecha",        align:"left"},
    {key:"cancha",  label:"Cancha",       align:"left"},
    {key:"golpes",  label:"Golpes",       align:"right"},
    {key:"neto",    label:"Neto",         align:"right"},
    {key:"puttsH",  label:"Putts/h",      align:"right"},
    {key:"chipsH",  label:"Chips/h",      align:"right"},
    {key:"bunkerH", label:"Búnker/h",     align:"right"},
    {key:"dist1p",  label:"Dist. 1ª putt",align:"right"},
    {key:"gapi",    label:"GAPI",          align:"right"},
  ];

  if(selAlumno){
    const statsArr=selAlumno.clases.map(cl=>({cl,stats:calcClaseStats(cl,selAlumno)})).filter(x=>x.stats&&x.stats.n>0);
    if(!statsArr.length)return(
      <div>
        <button style={{...S.btn("g"),marginBottom:"14px"}} onClick={()=>setSelAlumnoKey(null)}>← Volver</button>
        <div style={{...S.card,color:"#b09050",textAlign:"center",padding:"24px"}}>Sin datos suficientes para mostrar estadísticas.</div>
      </div>
    );

    const avgGolpes=numAvg(statsArr.map(x=>x.stats.totalShots));
    const avgNeto=numAvg(statsArr.filter(x=>x.stats.neto!==null).map(x=>x.stats.neto));
    const avgPH=numAvg(statsArr.map(x=>parseFloat(x.stats.avgPuttsH)));
    const avgCH=numAvg(statsArr.map(x=>parseFloat(x.stats.avgChipsH)));
    const avgBH=numAvg(statsArr.map(x=>parseFloat(x.stats.avgBunkerH)));
    const avgDP1=numAvg(statsArr.filter(x=>x.stats.avgDistPutt1!==null).map(x=>parseFloat(x.stats.avgDistPutt1)));
    const avgGAPI=numAvg(statsArr.filter(x=>x.stats.gapiPct!==null).map(x=>x.stats.gapiPct));

    const thS={color:"#b09050",padding:"7px 10px",borderBottom:"2px solid #5a4a20",whiteSpace:"nowrap",fontSize:"11px",letterSpacing:"0.5px",textTransform:"uppercase",fontWeight:"bold"};
    const tdS=(align,bold,color)=>({padding:"7px 10px",textAlign:align||"right",color:color||"#f5ead0",fontWeight:bold?"bold":"normal",fontSize:"12px",whiteSpace:"nowrap",borderBottom:"1px solid #2a2218"});
    const ftS=(align,color)=>({padding:"8px 10px",textAlign:align||"right",color:color||gold,fontWeight:"bold",fontSize:"12px",background:"#1a1612",whiteSpace:"nowrap",borderTop:"2px solid #C9A84C"});

    return(
      <div>
        <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"14px",flexWrap:"wrap"}}>
          <button style={{...S.btn("g")}} onClick={()=>setSelAlumnoKey(null)}>← Volver</button>
          <div style={{color:gold,fontSize:"14px",fontWeight:"bold"}}>{selAlumno.apellido}, {selAlumno.nombre}</div>
          <div style={{color:"#b09050",fontSize:"11px"}}>{statsArr.length} clase{statsArr.length!==1?"s":""}</div>
        </div>

        <div style={{...S.card,padding:"0",overflow:"hidden"}}>
          <div style={{padding:"12px 16px",borderBottom:"1px solid #3a2e1a",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"6px"}}>
            <div style={{color:gold,fontSize:"13px",fontWeight:"bold",letterSpacing:"1px"}}>📊 Estadísticas por clase</div>
            <div style={{color:"#b09050",fontSize:"11px"}}>{selAlumno.apellido}, {selAlumno.nombre} · {statsArr.length} clase{statsArr.length!==1?"s":""}</div>
          </div>

          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",minWidth:"680px"}}>
              <thead>
                <tr style={{background:"#141210"}}>
                  {COLS.map(c=>(
                    <th key={c.key} style={{...thS,textAlign:c.align||"right"}}>{c.label}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {statsArr.map(({cl,stats},i)=>{
                  const nc=stats.neto;
                  const ncColor=nc===null?"#b09050":nc<0?"#6abf6a":nc>0?"#cf6679":"#b09050";
                  const gcColor=stats.gapiPct===null?"#b09050":stats.gapiPct>=50?"#6abf6a":stats.gapiPct>=30?"#C9A84C":"#cf6679";
                  return(
                    <tr key={cl.id} style={{background:i%2===0?"transparent":"#181410"}}>
                      <td style={tdS("left",false,"#b09050")}>{cl.fecha}</td>
                      <td style={tdS("left",false,"#c8b87a")}>{cl.courseName||"—"}{cl.configName?` · ${cl.configName}`:""}</td>
                      <td style={tdS("right",true,gold)}>{stats.totalShots}</td>
                      <td style={tdS("right",false,ncColor)}>{fmtNeto(nc)}</td>
                      <td style={tdS("right")}>{stats.avgPuttsH}</td>
                      <td style={tdS("right")}>{stats.avgChipsH}</td>
                      <td style={tdS("right")}>{stats.avgBunkerH}</td>
                      <td style={tdS("right")}>{stats.avgDistPutt1!==null?stats.avgDistPutt1+" m":"—"}</td>
                      <td style={tdS("right",false,gcColor)} title={stats.gapiTotal>0?`x̄ todos: ${stats.avgDistTodo}m · x̄ aciertos: ${stats.avgDistGapi}m`:""}>{stats.gapiPct!==null?`${stats.gapiN}/${stats.gapiTotal} (${stats.gapiPct}%)`:"—"}</td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr>
                  <td style={ftS("left","#C9A84C")}>PROMEDIO</td>
                  <td style={ftS("left","#b09050")}>{statsArr.length} clases</td>
                  <td style={ftS("right",gold)}>{fmtAvg(avgGolpes,1)}</td>
                  <td style={{...ftS("right"),color:avgNeto===null?"#b09050":avgNeto<0?"#6abf6a":avgNeto>0?"#cf6679":"#b09050"}}>{fmtNeto(avgNeto!==null?avgNeto:null)}</td>
                  <td style={ftS("right")}>{fmtAvg(avgPH,2)}</td>
                  <td style={ftS("right")}>{fmtAvg(avgCH,2)}</td>
                  <td style={ftS("right")}>{fmtAvg(avgBH,2)}</td>
                  <td style={ftS("right")}>{avgDP1!==null?avgDP1.toFixed(1)+" m":"—"}</td>
                  <td style={{...ftS("right"),color:avgGAPI===null?"#b09050":avgGAPI>=50?"#6abf6a":avgGAPI>=30?"#C9A84C":"#cf6679"}}>{avgGAPI!==null?Math.round(avgGAPI)+"%":"—"}</td>
                </tr>
              </tfoot>
            </table>
          </div>

          <div style={{padding:"9px 16px",borderTop:"1px solid #2a2218",display:"flex",gap:"14px",flexWrap:"wrap"}}>
            <span style={{fontSize:"10px",color:"#6abf6a"}}>● Verde = bajo par / ≥50% GAPI</span>
            <span style={{fontSize:"10px",color:"#C9A84C"}}>● Amarillo = 30–49% GAPI</span>
            <span style={{fontSize:"10px",color:"#cf6679"}}>● Rojo = sobre par / &lt;30% GAPI</span>
            <span style={{fontSize:"10px",color:"#b09050"}}>— = sin datos</span>
          </div>
        </div>

        <div style={{marginTop:"10px",fontSize:"10px",color:"#7a6030",lineHeight:"1.7"}}>
          <strong style={{color:"#9a8040"}}>Referencia:</strong> Golpes = total · Neto = vs par del recorrido · /h = por hoyo jugado · Dist. 1ª putt = promedio distancia primer putt · GAPI = Green Alcanzado en Primer Intento (n/total · % · pasar el cursor para ver distancias)
        </div>
      </div>
    );
  }

  return(
    <div>
      <div style={{color:gold,fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"10px"}}>Seleccioná un alumno</div>
      {finalizadas.map(a=>{
        const key=`${a.apellido}|${a.nombre}`;
        const clases=a.clases;
        const ultima=clases[clases.length-1];
        const lastStats=ultima?calcClaseStats(ultima,a):null;
        const allStats=clases.map(cl=>calcClaseStats(cl,a)).filter(Boolean);
        const avgShots=allStats.length?Math.round(allStats.reduce((s,x)=>s+x.totalShots,0)/allStats.length):null;
        return(
          <div key={key} style={{...S.card,cursor:"pointer",marginBottom:"8px"}} onClick={()=>setSelAlumnoKey(key)}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{color:"#f5ead0",fontWeight:"bold",fontSize:"13px"}}>{a.apellido}, {a.nombre}</div>
                <div style={{color:"#b09050",fontSize:"11px",marginTop:"2px"}}>
                  {clases.length} clase{clases.length!==1?"s":""}
                  {ultima&&<> · última: {ultima.fecha}</>}
                </div>
              </div>
              <div style={{textAlign:"right",display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"2px"}}>
                {lastStats&&<div style={{color:gold,fontSize:"17px",fontWeight:"bold",lineHeight:"1"}}>{lastStats.totalShots}<span style={{color:"#b09050",fontSize:"9px",marginLeft:"3px"}}>ult.</span></div>}
                {avgShots&&<div style={{color:"#b09050",fontSize:"10px"}}>x̄ {avgShots} golpes</div>}
                <div style={{color:"#7a6030",fontSize:"10px"}}>Ver tabla →</div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}
// ────────────────────────────────────────────────────────────────────────────

function ClaseEnCancha(){
  const CLASE_LS="coach:clases";
  const CLASE_ACTIVE_LS="coach:claseActiva";
  // Recuperar clase activa y fase si la app se cerró en medio de una clase
  const [phase,setPhase]=useState(()=>{
    const saved=lsGet(CLASE_ACTIVE_LS);
    return saved?"active":"list";
  });
  const [clases,setClases]=useState(()=>lsGet(CLASE_LS)||[]);
  const [cur,setCur]=useState(()=>lsGet(CLASE_ACTIVE_LS)||null);
  const [syncStatus,setSyncStatus]=useState("idle"); // "idle"|"syncing"|"ok"|"err"
  const [menuClaseId,setMenuClaseId]=useState(null); // id de la clase con menú de acciones abierto
  const [verArchivadas,setVerArchivadas]=useState(false);

  // Al montar: subir locales huérfanas + bajar de Supabase y fusionar
  useEffect(()=>{
    async function syncAll(){
      setSyncStatus("syncing");
      // 1) Subir todas las clases locales que no están en Supabase todavía
      const local=lsGet(CLASE_LS)||[];
      if(local.length>0){
        await Promise.all(local.map(c=>sbUpsertClase(c)));
      }
      // 2) Bajar todo desde Supabase
      const remote=await sbLoadClases();
      if(!remote){setSyncStatus("err");return;}
      // 3) Fusionar: remote tiene prioridad (es la fuente de verdad)
      const map={};
      local.forEach(c=>{map[c.id]=c;});
      remote.forEach(c=>{map[c.id]=c;});
      const merged=Object.values(map).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      lsSet(CLASE_LS,merged);
      setClases(merged);
      setSyncStatus("ok");
      setTimeout(()=>setSyncStatus("idle"),3000);
    }
    syncAll();
  },[]);
  const [selClase,setSelClase]=useState(null);
  const [selAlumno,setSelAlumno]=useState(null);
  const [claseView,setClaseView]=useState("historial"); // "historial"|"stats"
  const [claseEditando,setClaseEditando]=useState(null); // clase copia que se está editando
  // Estado de navegación de clase activa — a nivel padre para no resetearse al re-render
  const [selJ,setSelJ]=useState(0);
  const [selH,setSelH]=useState(1);
  const [subTab,setSubTab]=useState("tarjeta");
  const [recStatus,setRecStatus]=useState("idle");
  const [lightMode,setLightMode]=useState(()=>lsGet("coach:lightMode")||false);

  function toggleLight(v){setLightMode(v);lsSet("coach:lightMode",v);}

  function saveClases(arr,claseModificada){
    setClases(arr);
    lsSet(CLASE_LS,arr);
    // Subir a Supabase la clase que cambió (o todas si no se especifica)
    const toSync=claseModificada?[claseModificada]:arr;
    toSync.forEach(c=>{sbUpsertClase(c).then(ok=>{if(ok){setSyncStatus("ok");setTimeout(()=>setSyncStatus("idle"),2000);}else{setSyncStatus("err");}});});
  }

  // Persiste la clase activa en cada cambio — sobrevive salida de la app
  function setCurPersist(claseObj){
    setCur(claseObj);
    if(claseObj)lsSet(CLASE_ACTIVE_LS,claseObj);
    else lsSet(CLASE_ACTIVE_LS,null);
  }

  // ── Setup nueva clase ──────────────────────────────────────────────────────
  function SetupClase(){
    const [fecha,setFecha]=useState(new Date().toISOString().slice(0,10));
    const [numHolesSel,setNumHolesSel]=useState(9);
    // Jugadores con cancha/config individual
    const [jugadores,setJugadores]=useState([{nombre:"",apellido:"",hcp:"18",canchaId:"lomas",configKey:"lomas|Lomas Azul"}]);
    const [err,setErr]=useState("");

    function updJ(i,k,v){const a=[...jugadores];a[i]={...a[i],[k]:v};setJugadores(a);}
    function updJCancha(i,cid){
      const cfgs=Object.keys(PRESET_CONFIGS).filter(k=>k.startsWith(cid+"|"));
      const firstKey=cfgs.length?cfgs[0]:"";
      const a=[...jugadores];a[i]={...a[i],canchaId:cid,configKey:firstKey};setJugadores(a);
    }
    function addJugador(){
      if(jugadores.length<4){
        const last=jugadores[jugadores.length-1];
        setJugadores([...jugadores,{nombre:"",apellido:"",hcp:"18",canchaId:last.canchaId,configKey:last.configKey}]);
      }
    }
    function remJugador(i){if(jugadores.length>1)setJugadores(jugadores.filter((_,j)=>j!==i));}

    function iniciar(){
      const js=jugadores.filter(j=>j.nombre.trim()||j.apellido.trim());
      if(!js.length){setErr("Agregá al menos un jugador");return;}
      for(const j of js){if(!j.nombre.trim()||!j.apellido.trim()){setErr("Completá nombre y apellido de cada jugador");return;}}
      // numHoles: usar el del primer jugador con config, o el selector manual
      const firstCfg=js[0].configKey?PRESET_CONFIGS[js[0].configKey]:null;
      const holeCount=firstCfg?parseInt(numHolesSel)||Object.keys(firstCfg.holes).length:parseInt(numHolesSel)||9;
      // Armar clase — cada jugador carga sus propios hoyos según su config
      const nuevaClase={
        id:"clase_"+Date.now(),
        fecha,
        courseId:js[0].canchaId,
        courseName:(COURSES.find(c=>c.id===js[0].canchaId)||COURSES[0]).name,
        configName:firstCfg?firstCfg.name:"",
        numHoles:holeCount,
        jugadores:js.map(j=>{
          const cfg=j.configKey?PRESET_CONFIGS[j.configKey]:null;
          const holesBase={};
          if(cfg){Object.entries(cfg.holes).forEach(([h,v])=>{if(parseInt(h)<=holeCount)holesBase[parseInt(h)]={par:v.par,dist:v.dist,hcpIdx:v.hcpIdx};});}
          return{nombre:j.nombre.trim(),apellido:j.apellido.trim(),hcp:parseInt(j.hcp)||18,
            canchaId:j.canchaId,configKey:j.configKey,
            holes:cfg?JSON.parse(JSON.stringify(holesBase)):{},
            notas:{},notaGeneral:"",resumenCoach:"",planJuego:{},notasHoyo:{}};
        }),
        finalizada:false,createdAt:Date.now()
      };
      setCurPersist(nuevaClase);setSelJ(0);setSelH(1);setSubTab("tarjeta");setPhase("active");
      sbUpsertClase(nuevaClase);
    }

    return(
      <div style={S.page}>
        <button style={{...S.btn("g"),marginBottom:"14px"}} onClick={()=>setPhase("list")}>← Volver</button>
        <div style={S.h2}>Nueva Clase en Cancha</div>
        <div style={S.card}>
          <div style={{marginBottom:"12px"}}>
            <div style={{color:"#b09050",fontSize:"10px",marginBottom:"4px"}}>FECHA</div>
            <input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} style={{...S.inp,width:"100%"}}/>
          </div>
          <div style={{marginBottom:"14px"}}>
            <div style={{color:"#b09050",fontSize:"10px",marginBottom:"4px"}}>CANTIDAD DE HOYOS</div>
            <select value={numHolesSel} onChange={e=>setNumHolesSel(parseInt(e.target.value))} style={{...S.inp,width:"100%"}}>
              {[3,6,9,12,18].map(n=><option key={n} value={n}>{n} hoyos</option>)}
            </select>
          </div>
          <div style={{borderTop:"1px solid #5a4a20",paddingTop:"14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
              <div style={{color:gold,fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase"}}>Jugadores ({jugadores.length}/4)</div>
              {jugadores.length<4&&<button style={{...S.btn("g"),fontSize:"10px",padding:"4px 10px"}} onClick={addJugador}>+ Agregar</button>}
            </div>
            {jugadores.map((j,i)=>{
              const cfgsJ=Object.keys(PRESET_CONFIGS).filter(k=>k.startsWith(j.canchaId+"|"));
              const cfgJ=j.configKey?PRESET_CONFIGS[j.configKey]:null;
              return(
                <div key={i} style={{background:"#141210",borderRadius:"6px",padding:"10px",marginBottom:"8px",border:"1px solid #3a3020"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
                    <div style={{color:"#b09050",fontSize:"11px"}}>Jugador {i+1}</div>
                    {jugadores.length>1&&<button style={{background:"none",border:"none",color:"#c04040",cursor:"pointer",fontSize:"14px"}} onClick={()=>remJugador(i)}>✕</button>}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"8px"}}>
                    <input placeholder="Nombre" value={j.nombre} onChange={e=>updJ(i,"nombre",e.target.value)} style={{...S.inp,width:"100%"}}/>
                    <input placeholder="Apellido" value={j.apellido} onChange={e=>updJ(i,"apellido",e.target.value)} style={{...S.inp,width:"100%"}}/>
                  </div>
                  <div style={{marginBottom:"8px"}}>
                    <input type="number" placeholder="HCP" value={j.hcp} onChange={e=>updJ(i,"hcp",e.target.value)} min="0" max="54" style={{...S.inp,width:"80px"}}/>
                    <span style={{color:"#b09050",fontSize:"10px",marginLeft:"8px"}}>handicap</span>
                  </div>
                  <div style={{marginBottom:"6px"}}>
                    <div style={{color:"#b09050",fontSize:"10px",marginBottom:"4px"}}>CANCHA</div>
                    <select value={j.canchaId} onChange={e=>updJCancha(i,e.target.value)} style={{...S.inp,width:"100%"}}>
                      {COURSES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>
                  {cfgsJ.length>0&&(
                    <div>
                      <div style={{color:"#b09050",fontSize:"10px",marginBottom:"4px"}}>CONFIGURACIÓN</div>
                      <select value={j.configKey||""} onChange={e=>updJ(i,"configKey",e.target.value)} style={{...S.inp,width:"100%"}}>
                        <option value="">Sin configuración (manual)</option>
                        {cfgsJ.map(k=><option key={k} value={k}>{PRESET_CONFIGS[k].name}</option>)}
                      </select>
                      {cfgJ&&<div style={{color:"#8a9a70",fontSize:"11px",marginTop:"4px"}}>✓ {Object.keys(cfgJ.holes).length} hoyos precargados</div>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          {err&&<div style={{color:"#c04040",fontSize:"12px",marginBottom:"10px"}}>{err}</div>}
          <button style={{...S.btn("p"),width:"100%",marginTop:"6px"}} onClick={iniciar}>Iniciar Clase →</button>
        </div>
      </div>
    );
  }

  // ── Clase activa — delegada a componente externo ClaseActivaPanel ──────────

  // ── Lista / historial ───────────────────────────────────────────────────────
  if(phase==="setup")return <SetupClase/>;
  if(phase==="active")return <ClaseActivaPanel
    clase={cur}
    clases={clases}
    selJ={selJ} setSelJ={setSelJ}
    selH={selH} setSelH={setSelH}
    subTab={subTab} setSubTab={setSubTab}
    recStatus={recStatus} setRecStatus={setRecStatus}
    onUpdate={next=>{setCurPersist(next);setCur(next);}}
    onFinalizar={next=>{setCurPersist(next);setCur(next);setPhase("report");}}
    onGuardar={(next,arr)=>{setCurPersist(next);setCur(next);saveClases(arr,next);}}
    lightMode={lightMode} setLightMode={toggleLight}
  />;
  if(phase==="report"){
    function guardarYSalir(){
      const arr=[...clases.filter(c=>c.id!==cur.id),cur];
      saveClases(arr,cur);
      setCurPersist(null); // limpia el activo — ya quedó guardado en historial
      setPhase("list");setCur(null);
    }
    return <ReporteClase clase={cur} onBack={guardarYSalir} onUpdate={next=>{
      const arr=[...clases.filter(c=>c.id!==next.id),next];
      saveClases(arr,next);setCurPersist(next);setCur(next);
    }} lightMode={lightMode} setLightMode={toggleLight}/>;
  }
  if(claseEditando)return(
    <div>
      <div style={{background:"#1a1612",padding:"10px 14px",borderBottom:"2px solid #C9A84C",display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}}>
        <span style={{color:"#C9A84C",fontWeight:"bold",fontSize:"13px"}}>✏️ Editando copia V{claseEditando.version}</span>
        <span style={{color:"#b09050",fontSize:"11px"}}>El original no se modifica</span>
        <button onClick={cerrarEdicion} style={{marginLeft:"auto",background:"none",border:"1px solid #5a4a20",borderRadius:"4px",color:"#b09050",cursor:"pointer",fontSize:"11px",padding:"4px 10px"}}>← Volver al historial</button>
      </div>
      <ClaseActivaPanel
        clase={claseEditando}
        clases={clases}
        selJ={selJ} setSelJ={setSelJ}
        selH={selH} setSelH={setSelH}
        subTab={subTab} setSubTab={setSubTab}
        recStatus={recStatus} setRecStatus={setRecStatus}
        onUpdate={next=>{guardarCopiaEditada(next);}}
        onFinalizar={next=>{guardarCopiaEditada(next);cerrarEdicion();}}
        onGuardar={(next,arr)=>{guardarCopiaEditada(next);}}
        lightMode={lightMode} setLightMode={toggleLight}
        modoEdicion={true}
      />
    </div>
  );

  if(selClase){
    // Buscar todas las versiones de esta clase (original + copias)
    const parentId=selClase.parentId||selClase.id;
    const todasVersiones=[clases.find(c=>c.id===parentId),...clases.filter(c=>c.parentId===parentId&&c.version)].filter(Boolean).sort((a,b)=>(a.version||0)-(b.version||0));
    return(
      <div>
        {todasVersiones.length>1&&(
          <div style={{background:"#1a1612",padding:"10px 14px",borderBottom:"1px solid #5a4a20",display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
            <span style={{color:"#b09050",fontSize:"11px",marginRight:"4px"}}>Versiones:</span>
            {todasVersiones.map((v,i)=>{
              const lbl=v.version?`V${v.version}`:"Original";
              const ts=v.createdAt?new Date(v.createdAt).toLocaleString("es-AR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"";
              const activa=selClase.id===v.id;
              return(
                <button key={v.id} onClick={()=>setSelClase(v)} style={{
                  background:activa?"#C9A84C":"#2a2318",color:activa?"#1a1612":"#b09050",
                  border:`1px solid ${activa?"#C9A84C":"#5a4a20"}`,borderRadius:"4px",
                  padding:"4px 10px",fontSize:"11px",cursor:"pointer"
                }}>{lbl}{ts?` · ${ts}`:""}</button>
              );
            })}
          </div>
        )}
        <ReporteClase clase={selClase} onBack={()=>setSelClase(null)} onUpdate={next=>{
          const arr=[...clases.filter(c=>c.id!==next.id),next];
          saveClases(arr,next);setSelClase(next);
        }} lightMode={lightMode} setLightMode={toggleLight} readOnly={true}/>
      </div>
    );
  }

  async function crearCopiaEditable(claseOriginal){
    // Buscar cuántas versiones ya existen de este original
    const parentId=claseOriginal.parentId||claseOriginal.id;
    const versiones=clases.filter(c=>c.parentId===parentId||c.id===parentId);
    const nextVersion=versiones.filter(c=>c.version).length+1;
    if(!window.confirm(`Se va a crear una copia editable (V${nextVersion}). El original queda guardado sin cambios. ¿Continuar?`))return;
    const copia={
      ...JSON.parse(JSON.stringify(claseOriginal)),
      id:"clase_"+Date.now(),
      parentId,
      version:nextVersion,
      createdAt:Date.now(),
      finalizada:true,
    };
    const arr=[...clases,copia];
    setClases(arr);
    lsSet(CLASE_LS,arr);
    const ok=await sbUpsertClase(copia);
    if(!ok)setSyncStatus("err");
    // Abrir para editar
    setClaseEditando(copia);
  }

  function guardarCopiaEditada(next){
    const arr=[...clases.filter(c=>c.id!==next.id),next];
    saveClases(arr,next);
    setClaseEditando(next);
  }

  function cerrarEdicion(){
    setClaseEditando(null);
  }

  function archivarClase(id){
    const arr=clases.map(c=>c.id===id?{...c,archivada:true}:c);
    saveClases(arr,arr.find(c=>c.id===id));
    if(cur&&cur.id===id){setCurPersist(null);setCur(null);}
    setMenuClaseId(null);
  }
  async function eliminarDefinitivo(id){
    if(!window.confirm("⚠️ Esta acción no se puede deshacer.\nLa clase se borrará para siempre. ¿Continuar?"))return;
    const arr=clases.filter(c=>c.id!==id);
    setClases(arr);lsSet(CLASE_LS,arr);
    if(cur&&cur.id===id){setCurPersist(null);setCur(null);}
    try{await fetch(SB_URL+"/rest/v1/clases?id=eq."+id,{method:"DELETE",headers:H});}catch{}
    setSyncStatus("ok");
    setMenuClaseId(null);
  }
  function desarchivarClase(id){
    const arr=clases.map(c=>c.id===id?{...c,archivada:false}:c);
    saveClases(arr,arr.find(c=>c.id===id));
    setMenuClaseId(null);
  }

  // Historial alfabético
  const byAlumno={};
  clases.forEach(cl=>{
    cl.jugadores.forEach(j=>{
      const key=`${j.apellido}|${j.nombre}`;
      if(!byAlumno[key])byAlumno[key]={apellido:j.apellido,nombre:j.nombre,clases:[]};
      byAlumno[key].clases.push(cl);
    });
  });
  const alumnos=Object.values(byAlumno).sort((a,b)=>a.apellido.localeCompare(b.apellido)||a.nombre.localeCompare(b.nombre));

  return(
    <div style={S.page}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
        <div>
          <div style={S.h2}>Clases en Cancha</div>
          {syncStatus==="syncing"&&<div style={{fontSize:"10px",color:"#b09050",marginTop:"2px"}}>⟳ Sincronizando...</div>}
          {syncStatus==="ok"&&<div style={{fontSize:"10px",color:"#6a9a50",marginTop:"2px"}}>✓ Sincronizado</div>}
          {syncStatus==="err"&&<div style={{fontSize:"10px",color:"#c04040",marginTop:"2px"}}>⚠ Sin conexión — guardado local</div>}
        </div>
        <button style={S.btn("p")} onClick={()=>setPhase("setup")}>+ Nueva Clase</button>
      </div>
      <div style={{display:"flex",gap:"6px",marginBottom:"14px"}}>
        <button style={S.nb(claseView==="historial")} onClick={()=>setClaseView("historial")}>📋 Historial</button>
        <button style={S.nb(claseView==="stats")} onClick={()=>setClaseView("stats")}>📊 Estadísticas</button>
      </div>

      {claseView==="stats"&&<ClaseStatsPanel alumnos={alumnos}/>}
      {claseView==="historial"&&clases.filter(c=>!c.finalizada).length>0&&(
        <div style={{...S.card,background:"#1a2a12",border:"1px solid #3a6a2a",marginBottom:"14px"}}>
          <div style={{color:"#6a9a50",fontSize:"11px",letterSpacing:"1px",marginBottom:"8px"}}>📋 BORRADORES EN CURSO</div>
          {clases.filter(c=>!c.finalizada).map(cl=>(
            <div key={cl.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #2a3a20"}}>
              <div style={{flex:1,cursor:"pointer"}} onClick={()=>{setCurPersist(cl);setPhase("active");}}>
                <div style={{color:"#f5ead0",fontSize:"13px"}}>{cl.fecha} · {cl.courseName}</div>
                <div style={{color:"#b09050",fontSize:"10px"}}>{cl.jugadores.map(j=>`${j.nombre} ${j.apellido}`).join(", ")}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                <div style={{color:"#6a9a50",fontSize:"10px",cursor:"pointer"}} onClick={()=>{setCurPersist(cl);setPhase("active");}}>Continuar →</div>
                <button onClick={()=>eliminarDefinitivo(cl.id)} style={{background:"none",border:"1px solid #7a2020",borderRadius:"4px",color:"#c04040",cursor:"pointer",fontSize:"11px",padding:"3px 8px"}}>✕</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {claseView==="historial"&&(()=>{

              if(!clasesAlumno.length)return null;
              return(
                <div key={`${a.apellido}|${a.nombre}`} style={{...S.card,marginBottom:"12px"}}>
                  <div style={{color:gold,fontSize:"13px",fontWeight:"bold",marginBottom:"10px"}}>{a.apellido}, {a.nombre}</div>
                  {clasesAlumno.map(cl=>{
                    const jd=cl.jugadores.find(j=>j.apellido===a.apellido&&j.nombre===a.nombre);
                    const total=jd?Object.values(jd.holes||{}).reduce((s,h)=>s+(parseInt(h.shots)||0),0):0;
                    return(
                      <div key={cl.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #3a3020"}}>
                        <div style={{flex:1,cursor:"pointer"}} onClick={()=>setSelClase(cl)}>
                          <div style={{color:"#f5ead0",fontSize:"12px"}}>{cl.fecha} · {cl.courseName}{cl.configName?` · ${cl.configName}`:""}</div>
                          <div style={{color:"#b09050",fontSize:"10px"}}>{cl.numHoles} hoyos · {cl.jugadores.length} jugador{cl.jugadores.length!==1?"es":""}</div>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",justifyContent:"flex-end"}}>
                          {total>0&&<div style={{color:gold,fontSize:"16px",fontWeight:"bold",cursor:"pointer"}} onClick={()=>setSelClase(cl)}>{total}</div>}
                          {cl.version&&<span style={{fontSize:"9px",color:"#C9A84C",border:"1px solid #C9A84C",borderRadius:"3px",padding:"1px 5px"}}>V{cl.version}</span>}
                          <div style={{color:"#b09050",fontSize:"10px",cursor:"pointer"}} onClick={()=>setSelClase(cl)}>Ver →</div>
                          <button onClick={()=>crearCopiaEditable(cl)} style={{background:"none",border:"1px solid #4a7a30",borderRadius:"4px",color:"#7ab050",cursor:"pointer",fontSize:"10px",padding:"3px 7px"}}>✏️ Modificar</button>
                          <div style={{position:"relative",zIndex:100}}>
                            <button onClick={e=>{e.stopPropagation();setMenuClaseId(menuClaseId===cl.id?null:cl.id);}} style={{background:"none",border:"1px solid #5a4a20",borderRadius:"4px",color:"#b09050",cursor:"pointer",fontSize:"12px",padding:"3px 9px",fontWeight:"bold"}}>⋯</button>
                            {menuClaseId===cl.id&&(
                              <div style={{position:"absolute",right:0,top:"100%",marginTop:"4px",background:"#1c1810",border:"1px solid #5a4a20",borderRadius:"6px",zIndex:200,minWidth:"200px",boxShadow:"0 4px 16px rgba(0,0,0,0.7)"}}>
                                <button onClick={e=>{e.stopPropagation();archivarClase(cl.id);}} style={{display:"block",width:"100%",padding:"10px 14px",background:"none",border:"none",borderBottom:"1px solid #3a2e18",color:"#b09050",cursor:"pointer",fontSize:"12px",textAlign:"left"}}>📦 Archivar</button>
                                <button onClick={e=>{e.stopPropagation();eliminarDefinitivo(cl.id);}} style={{display:"block",width:"100%",padding:"10px 14px",background:"none",border:"none",color:"#c04040",cursor:"pointer",fontSize:"12px",textAlign:"left"}}>🗑 Eliminar definitivamente</button>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })}

            {/* Sección archivadas */}
            {archivadas.length>0&&(
              <div style={{marginTop:"8px"}}>
                <button onClick={()=>setVerArchivadas(v=>!v)} style={{width:"100%",background:"#141210",border:"1px solid #3a2e18",borderRadius:"6px",padding:"10px 14px",color:"#7a6030",fontSize:"11px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span>📦 Archivadas ({archivadas.length})</span>
                  <span>{verArchivadas?"▲":"▼"}</span>
                </button>
                {verArchivadas&&(
                  <div style={{border:"1px solid #3a2e18",borderTop:"none",borderRadius:"0 0 6px 6px",background:"#0f0d0a",padding:"4px 0"}}>
                    {archivadas.sort((x,y)=>y.createdAt-x.createdAt).map(cl=>{
                      const jugNombres=cl.jugadores.map(j=>`${j.nombre} ${j.apellido}`).join(", ");
                      return(
                        <div key={cl.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 14px",borderBottom:"1px solid #2a2218"}}>
                          <div>
                            <div style={{color:"#7a6030",fontSize:"12px"}}>{cl.fecha} · {cl.courseName}</div>
                            <div style={{color:"#5a4a20",fontSize:"10px"}}>{jugNombres}</div>
                          </div>
                          <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                            {cl.version&&<span style={{fontSize:"9px",color:"#5a4020",border:"1px solid #5a4020",borderRadius:"3px",padding:"1px 4px"}}>V{cl.version}</span>}
                            <button onClick={()=>setSelClase(cl)} style={{background:"none",border:"1px solid #3a2e18",borderRadius:"4px",color:"#7a6030",cursor:"pointer",fontSize:"10px",padding:"3px 7px"}}>Ver</button>
                            <button onClick={()=>desarchivarClase(cl.id)} style={{background:"none",border:"1px solid #3a5a20",borderRadius:"4px",color:"#6a8a40",cursor:"pointer",fontSize:"10px",padding:"3px 7px"}}>Restaurar</button>
                            <button onClick={()=>eliminarDefinitivo(cl.id)} style={{background:"none",border:"1px solid #5a2020",borderRadius:"4px",color:"#9a3030",cursor:"pointer",fontSize:"10px",padding:"3px 7px"}}>Eliminar</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
}

function AdminPanel(){
  const [codes,setCodes]=useState([]);
  const [loading,setLoading]=useState(true);
  const [newName,setNewName]=useState("");
  const [creating,setCreating]=useState(false);
  const [msg,setMsg]=useState(null); // {type:"ok"|"err", text}

  async function loadCodes(){
    setLoading(true);
    const rows=await sbLoadInviteCodes();
    setCodes(rows||[]);
    setLoading(false);
  }
  useEffect(()=>{loadCodes();},[]);

  async function createCode(){
    if(creating)return;
    setCreating(true);setMsg(null);
    const code=await sbCreateInviteCode(newName.trim());
    if(code){setNewName("");setMsg({type:"ok",text:`Código creado: ${code}`});await loadCodes();}
    else setMsg({type:"err",text:"Error al crear código. Verificá conexión."});
    setCreating(false);
  }

  async function deleteCode(code){
    if(!window.confirm(`¿Eliminar código ${code}?`))return;
    setMsg(null);
    const ok=await sbDeleteInviteCode(code);
    if(ok){setMsg({type:"ok",text:"Código eliminado."});await loadCodes();}
    else setMsg({type:"err",text:"Error al eliminar."});
  }

  const pending=codes.filter(c=>!c.used_by);
  const used=codes.filter(c=>c.used_by);

  return(
    <div>
      <div style={{...S.card,marginBottom:"14px"}}>
        <div style={{color:gold,fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"12px"}}>Crear código de invitación</div>
        <label style={S.lbl}>Para quién (opcional)</label>
        <input style={{...S.inp,marginBottom:"10px"}} placeholder="Ej: Juan Pérez" value={newName} onChange={e=>setNewName(e.target.value)}/>
        <button style={{...S.btn("g"),width:"100%"}} onClick={createCode} disabled={creating}>{creating?"Creando...":"+ Generar código"}</button>
        {msg&&<div style={{background:msg.type==="ok"?"#1a2a1a":"#3a1010",border:`1px solid ${msg.type==="ok"?"#2a5a2a":"#7a2020"}`,borderRadius:"4px",padding:"9px 13px",fontSize:"13px",color:msg.type==="ok"?"#8e8":"#e88",marginTop:"10px",wordBreak:"break-all"}}>{msg.text}</div>}
      </div>

      {loading?<div style={{color:"#b09050",textAlign:"center",padding:"20px"}}>Cargando...</div>:<>
        {pending.length>0&&<>
          <div style={{color:gold,fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"8px"}}>Códigos disponibles ({pending.length})</div>
          {pending.map(c=>(
            <div key={c.code} style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",marginBottom:"8px"}}>
              <div>
                <div style={{color:"#f5ead0",fontSize:"15px",fontWeight:"bold",letterSpacing:"2px"}}>{c.code}</div>
                {c.assigned_to&&<div style={{color:"#b09050",fontSize:"11px"}}>Para: {c.assigned_to}</div>}
                <div style={{color:"#b09050",fontSize:"10px"}}>{c.created_at?new Date(c.created_at).toLocaleDateString("es-AR"):""}</div>
              </div>
              <button onClick={()=>deleteCode(c.code)} style={{...S.btn("d"),fontSize:"11px",padding:"5px 9px"}}>✕ Borrar</button>
            </div>
          ))}
        </>}
        {pending.length===0&&!loading&&<div style={{...S.card,color:"#b09050",textAlign:"center",padding:"20px",marginBottom:"12px"}}>No hay códigos disponibles.</div>}

        {used.length>0&&<>
          <div style={{color:"#6a7a50",fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase",margin:"16px 0 8px"}}>Códigos ya usados ({used.length})</div>
          {used.map(c=>(
            <div key={c.code} style={{...S.card,padding:"10px 12px",marginBottom:"8px",opacity:0.7}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{color:"#b09050",fontSize:"13px",letterSpacing:"1px",textDecoration:"line-through"}}>{c.code}</div>
                  {c.assigned_to&&<div style={{color:"#b09050",fontSize:"11px"}}>Para: {c.assigned_to}</div>}
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{color:"#6a9a50",fontSize:"11px"}}>✓ Usado por</div>
                  <div style={{color:"#f5ead0",fontSize:"12px"}}>{c.used_by}</div>
                  {c.used_at&&<div style={{color:"#b09050",fontSize:"10px"}}>{new Date(c.used_at).toLocaleDateString("es-AR")}</div>}
                </div>
              </div>
            </div>
          ))}
        </>}
      </>}
    </div>
  );
}

function CoachPanel(){
  // Si hay una clase activa guardada, arrancar directo en ese tab
  const [tab,setTab]=useState(()=>lsGet("coach:claseActiva")?"clase":"ranking");
  const [players,setPlayers]=useState([]);
  const [selPlayer,setSelPlayer]=useState(null);
  const [selRound,setSelRound]=useState(null);
  const [selPlayerTab,setSelPlayerTab]=useState("vueltas");
  const [loading,setLoading]=useState(false);

  useEffect(()=>{loadAll();},[]);

  async function loadAll(){
    setLoading(true);
    try{
      const sbRounds=await sbQ("rounds?order=created_at.desc");
      const sbUsers=await sbQ("users");
      const userMap={};
      (sbUsers||[]).forEach(u=>{userMap[u.username]={username:u.username,name:u.name,hcp:u.hcp||18,hcpT:u.hcpt||"libre",notas:u.notas||{}}});
      const byPlayer={};
      (sbRounds||[]).forEach(r=>{
        if(!byPlayer[r.username])byPlayer[r.username]={user:userMap[r.username]||{username:r.username,name:r.player_name,hcp:r.hcp||18},rounds:[]};
        byPlayer[r.username].rounds.push(r);
      });
      const result=Object.values(byPlayer);
      setPlayers(result.length?result:lsGet("coach:players")||[]);
    }catch{setPlayers(lsGet("coach:players")||[]);}
    finally{setLoading(false);}
  }

  function allRounds(){return players.flatMap(p=>p.rounds).sort((a,b)=>(b.created_at||b.createdAt||0)-(a.created_at||a.createdAt||0))}

  function ranking(){
    const pl={};
    players.forEach(pkg=>{
      const u=pkg.user;if(!u)return;
      const shots=pkg.rounds.reduce((s,r)=>s+(r.total_shots||r.totalShots||0),0);
      pl[u.username]={name:u.name,hcp:u.hcp,rounds:pkg.rounds,shots};
    });
    return Object.values(pl).filter(p=>p.rounds.length).sort((a,b)=>(a.shots/a.rounds.length)-(b.shots/b.rounds.length));
  }

  if(selRound)return <RoundDetail round={selRound} onBack={()=>setSelRound(null)} coachView/>;
  const rank=ranking();

  return(
    <div style={S.page}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
        <div style={S.h2}>Panel Coach</div>
        <button style={{...S.btn("g"),fontSize:"11px",padding:"6px 10px"}} onClick={loadAll}>{loading?"⟳...":"⟳ Actualizar"}</button>
      </div>
      <div style={{display:"flex",gap:"5px",flexWrap:"wrap",marginBottom:"16px"}}>
        {[["ranking","Ranking"],["players","Jugadores"],["rounds","Vueltas"],["clase","Clase"],["admin","Admin"]].map(([t,l])=>(
          <button key={t} style={S.nb(tab===t)} onClick={()=>{setTab(t);setSelPlayer(null);setSelPlayerTab("vueltas")}}>{l}</button>
        ))}
      </div>
      {loading&&<div style={{color:"#b09050",padding:"20px",textAlign:"center"}}>Cargando datos...</div>}

      {tab==="ranking"&&!loading&&(
        rank.length===0
          ?<div style={{...S.card,color:"#b09050",textAlign:"center",padding:"36px"}}>No hay datos aún.</div>
          :rank.map((p,i)=>{
            const avgGross=(p.shots/p.rounds.length).toFixed(1);
            const netoShots=p.rounds.reduce((s,r)=>s+((r.total_shots||r.totalShots||0)-(r.hcp||0)),0);
            const avgNeto=(netoShots/p.rounds.length).toFixed(1);
            const best=Math.min(...p.rounds.map(r=>r.total_shots||r.totalShots||999));
            const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":"";
            return(
              <div key={p.name} style={{...S.card,display:"flex",alignItems:"center",gap:"12px",padding:"12px 14px"}}>
                <div style={{fontSize:"18px",minWidth:"26px",textAlign:"center"}}>{medal||<span style={{color:"#b09050",fontSize:"12px",fontWeight:"bold"}}>#{i+1}</span>}</div>
                <div style={{flex:1}}>
                  <div style={{color:"#f5ead0",fontWeight:"bold",fontSize:"13px"}}>{p.name}</div>
                  <div style={{color:"#b09050",fontSize:"10px"}}>{getCat(p.hcp)} · HCP {p.hcp} · {p.rounds.length} vuelta{p.rounds.length!==1?"s":""}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{color:gold,fontSize:"17px",fontWeight:"bold"}}>{avgGross} <span style={{fontSize:"11px",color:"#b09050"}}>gross</span></div>
                  <div style={{color:"#b09050",fontSize:"13px",fontWeight:"bold"}}>{avgNeto} <span style={{fontSize:"10px"}}>neto</span></div>
                  <div style={{color:"#b09050",fontSize:"10px"}}>mejor: {best===999?"—":best}</div>
                </div>
              </div>
            );
          })
      )}

      {tab==="players"&&!loading&&!selPlayer&&(
        players.length===0
          ?<div style={{...S.card,color:"#b09050",textAlign:"center",padding:"36px"}}>No hay alumnos aún.</div>
          :players.map(pkg=>{
            const p=pkg.user,rs=pkg.rounds;
            const avg=rs.length?(rs.reduce((s,r)=>s+(r.total_shots||r.totalShots||0),0)/rs.length).toFixed(1):"—";
            return(
              <div key={p.username} style={{...S.card,cursor:"pointer"}} onClick={()=>{setSelPlayer(pkg);setSelPlayerTab("vueltas")}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{color:"#f5ead0",fontWeight:"bold"}}>{p.name}</div>
                    <div style={{color:"#b09050",fontSize:"11px"}}>{getCat(p.hcp)} · HCP {p.hcp} · {rs.length} vuelta{rs.length!==1?"s":""}</div>
                  </div>
                  <div style={{color:gold,fontSize:"19px",fontWeight:"bold"}}>{avg}</div>
                </div>
              </div>
            );
          })
      )}

      {tab==="players"&&selPlayer&&(
        <>
          <button style={{...S.btn("g"),marginBottom:"12px"}} onClick={()=>setSelPlayer(null)}>← Jugadores</button>
          <div style={{color:gold,fontSize:"15px",fontWeight:"bold",marginBottom:"4px"}}>{selPlayer.user.name}</div>
          <div style={{color:"#b09050",fontSize:"11px",marginBottom:"14px"}}>HCP {selPlayer.user.hcp} · {getCat(selPlayer.user.hcp)}</div>
          <div style={{display:"flex",gap:"5px",flexWrap:"wrap",marginBottom:"14px"}}>
            {[["vueltas","Vueltas"],["stats","Estadísticas"],["notas","Notas y Canchas"]].map(([t,l])=>(
              <button key={t} style={{...S.nb(selPlayerTab===t),flex:1}} onClick={()=>setSelPlayerTab(t)}>{l}</button>
            ))}
          </div>
          {selPlayerTab==="stats"&&<CoachPlayerStats player={selPlayer}/>}
          {selPlayerTab==="notas"&&(
            <div style={S.card}>
              <div style={{color:gold,fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"12px"}}>Resetear contraseña</div>
              <CoachPassReset username={selPlayer.user.username}/>
              <div style={{borderTop:"1px solid #5a4a20",marginTop:"2px",paddingTop:"14px"}}>
              <div style={{color:gold,fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"12px"}}>Notas mentales</div>
              {(()=>{
                const notas=selPlayer.user.notas||{};
                const tieneNotas=Object.values(notas).some(Boolean);
                if(!tieneNotas)return <div style={{color:"#b09050",fontSize:"13px",marginBottom:"14px"}}>Sin notas mentales cargadas.</div>;
                return [...ZONES,"Nota general"].map(z=>notas[z]&&(
                  <div key={z} style={{marginBottom:"12px"}}>
                    <div style={{color:"#b09050",fontSize:"10px",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px"}}>{z}</div>
                    <div style={{color:"#f5ead0",fontSize:"13px",background:"#141210",padding:"10px",borderRadius:"4px",border:"1px solid #5a4a20"}}>{notas[z]}</div>
                  </div>
                ));
              })()}
              <div style={{borderTop:"1px solid #5a4a20",marginTop:"14px",paddingTop:"14px"}}>
                <div style={{color:gold,fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"8px"}}>Configuraciones de cancha</div>
                {(()=>{
                  const cfgs={...PRESET_CONFIGS,...(lsGet("configs:"+selPlayer.user.username)||{})};
                  const keys=Object.keys(cfgs);
                  if(!keys.length)return <div style={{color:"#b09050",fontSize:"13px"}}>Sin configuraciones.</div>;
                  return keys.map(k=>{
                    const cfg=cfgs[k];const course=COURSES.find(c=>c.id===cfg.courseId);const isP=!!PRESET_CONFIGS[k];
                    return(<div key={k} style={{padding:"8px 0",borderBottom:"1px solid #3a3020"}}><div style={{color:"#f5ead0",fontSize:"13px"}}>{cfg.name}{isP&&<span style={{marginLeft:"6px",fontSize:"9px",color:"#6a9a50",border:"1px solid #3a6a2a",borderRadius:"3px",padding:"1px 4px"}}>APP</span>}</div><div style={{color:"#b09050",fontSize:"10px"}}>{course?.name||cfg.courseId} · {Object.keys(cfg.holes||{}).length} hoyos</div></div>);
                  });
                })()}
              </div>
              </div>
            </div>
          )}
          {selPlayerTab==="vueltas"&&(
            <div style={S.card}>
              {selPlayer.rounds.length===0&&<div style={{color:"#b09050"}}>Sin vueltas registradas.</div>}
              {selPlayer.rounds.map(r=>{
                const is18r=(r.num_holes||r.numHoles||18)===18;
                const h=r.holes||{};
                let ida18=0,vuelta18=0;
                if(is18r){for(let i=1;i<=9;i++)ida18+=parseInt(h[i]?.shots||h[String(i)]?.shots||0);for(let i=10;i<=18;i++)vuelta18+=parseInt(h[i]?.shots||h[String(i)]?.shots||0);}
                const dp1rc=(()=>{const vals=[];Object.values(h).forEach(hh=>{const v=parseFloat(hh.distPutt1);if(v>0)vals.push(v);});return vals;})();
                const avgDP1rc=dp1rc.length?(dp1rc.reduce((a,b)=>a+b,0)/dp1rc.length).toFixed(1):null;
                const totDP1rc=dp1rc.length?dp1rc.reduce((a,b)=>a+b,0):null;
                return(
                <div key={r.id} style={{cursor:"pointer",padding:"9px 0",borderBottom:"1px solid #3a3020",display:"flex",justifyContent:"space-between",alignItems:"center"}} onClick={()=>setSelRound(r)}>
                  <div>
                    <div style={{color:"#f5ead0",fontSize:"13px"}}>{r.course_name||r.courseName}</div>
                    <div style={{color:"#b09050",fontSize:"10px"}}>{r.date} · {r.format} · {r.num_holes||r.numHoles||18} hoyos{(r.tipo||r.tipo_vuelta)&&(r.tipo||r.tipo_vuelta)!=="Práctica"?<span style={{marginLeft:"6px",background:"#1a3a1a",color:"#6abf6a",border:"1px solid #2a5a2a",borderRadius:"4px",padding:"1px 5px",fontSize:"10px"}}>🏆 Competitiva</span>:null}</div>
                    {is18r&&ida18>0&&vuelta18>0&&<div style={{color:"#b09050",fontSize:"10px"}}>IDA <span style={{color:"#f5ead0"}}>{ida18}</span> · VUELTA <span style={{color:"#f5ead0"}}>{vuelta18}</span></div>}
                    {avgDP1rc&&<div style={{color:"#b09050",fontSize:"10px"}}>1er putt <span style={{color:"#f5ead0"}}>{avgDP1rc} yds</span> · recorrido <span style={{color:"#f5ead0"}}>{totDP1rc} yds</span></div>}
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{color:gold,fontSize:"18px",fontWeight:"bold"}}>{r.total_shots||r.totalShots}</div>
                    <div style={{color:"#b09050",fontSize:"10px"}}>Neto: {(r.total_shots||r.totalShots||0)-(r.hcp||0)}</div>
                  </div>
                </div>
                );
              })}
            </div>
          )}
        </>
      )}

      {tab==="clase"&&<ClaseEnCancha/>}

      {tab==="admin"&&<AdminPanel/>}

      {tab==="rounds"&&!loading&&(
        allRounds().length===0
          ?<div style={{...S.card,color:"#b09050",textAlign:"center",padding:"36px"}}>No hay vueltas aún.</div>
          :allRounds().map(r=>{
            const is18r=(r.num_holes||r.numHoles||18)===18;
            const h=r.holes||{};
            let ida18=0,vuelta18=0;
            if(is18r){for(let i=1;i<=9;i++)ida18+=parseInt(h[i]?.shots||h[String(i)]?.shots||0);for(let i=10;i<=18;i++)vuelta18+=parseInt(h[i]?.shots||h[String(i)]?.shots||0);}
            const dp1rg=(()=>{const vals=[];Object.values(h).forEach(hh=>{const v=parseFloat(hh.distPutt1);if(v>0)vals.push(v);});return vals;})();
            const avgDP1rg=dp1rg.length?(dp1rg.reduce((a,b)=>a+b,0)/dp1rg.length).toFixed(1):null;
            const totDP1rg=dp1rg.length?dp1rg.reduce((a,b)=>a+b,0):null;
            return(
            <div key={r.id} style={{...S.card,cursor:"pointer"}} onClick={()=>setSelRound(r)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{color:"#f5ead0",fontWeight:"bold"}}>{r.player_name||r.playerName}</div>
                  <div style={{color:"#b09050",fontSize:"11px"}}>{r.course_name||r.courseName} · {r.date} · {r.num_holes||r.numHoles||18} hoyos</div>
                  {is18r&&ida18>0&&vuelta18>0&&<div style={{color:"#b09050",fontSize:"11px"}}>IDA <span style={{color:"#f5ead0"}}>{ida18}</span> · VUELTA <span style={{color:"#f5ead0"}}>{vuelta18}</span></div>}
                  {avgDP1rg&&<div style={{color:"#b09050",fontSize:"11px"}}>1er putt <span style={{color:"#f5ead0"}}>{avgDP1rg} yds</span> · recorrido <span style={{color:"#f5ead0"}}>{totDP1rg} yds</span></div>}
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{color:gold,fontSize:"20px",fontWeight:"bold"}}>{r.total_shots||r.totalShots}</div>
                  <div style={{color:"#b09050",fontSize:"10px"}}>Neto: {(r.total_shots||r.totalShots||0)-(r.hcp||0)}</div>
                </div>
              </div>
            </div>
            );
          })
      )}
    </div>
  );
}

function App(){
  const [user,setUser]=useState(()=>lsGet("session"));
  const [tab,setTab]=useState(()=>{
    const u=lsGet("session");
    if(!u)return "stats";
    // Si hay clase activa y el usuario es coach, arrancar directo en "coach"
    if(u.isCoach&&lsGet("coach:claseActiva"))return "coach";
    // Restaurar última pestaña visitada
    const saved=lsGet("nav:"+u.username);
    if(saved&&saved.tab)return saved.tab;
    return "stats";
  });
  const [newRound,setNR]=useState(()=>{
    const u=lsGet("session");
    if(!u)return false;
    const saved=lsGet("nav:"+u.username);
    return saved?.newRound||false;
  });

  // Interceptar flecha atrás del navegador/celular
  useEffect(()=>{
    // Agregar una entrada extra al historial para "atrapar" el back
    window.history.pushState({filo:true},"");
    function handlePop(e){
      // Volver a agregar la entrada para que el back siempre sea interceptado
      window.history.pushState({filo:true},"");
      if(window.confirm("¿Querés salir de Filo Golf?")){
        // El usuario confirmó — cerrar sesión o ir a inicio
        window.history.back();
      }
    }
    window.addEventListener("popstate",handlePop);
    return()=>window.removeEventListener("popstate",handlePop);
  },[]);

  if(!user)return <Auth onLogin={u=>{lsSet("session",u);setUser(u)}}/>;

  const nav=user.isCoach
    ?[["stats","Inicio"],["coach","Coach"],["ronda","+ Vuelta"]]
    :[["stats","Mis Stats"],["myrounds","Mis Vueltas"],["ronda","+ Vuelta"],["canchas","🏌 Canchas"],["profile","Perfil"]];

  function go(t){
    if(t==="ronda"){setNR(true);if(user)lsSet("nav:"+user.username,{tab,newRound:true});return;}
    setNR(false);setTab(t);
    if(user)lsSet("nav:"+user.username,{tab:t,newRound:false});
  }

  return(
    <div style={S.app}>
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"center"}}>
          <div style={{fontSize:"26px",color:gold,marginRight:"8px"}}>φ</div>
          <div>
            <div style={{fontSize:"12px",letterSpacing:"3px",color:gold,textTransform:"uppercase"}}>Filo Golf</div>
            <div style={{fontSize:"9px",color:"#b09050",letterSpacing:"2px"}}>por Filo Coach</div>
          </div>
        </div>
        <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
          {nav.map(([t,l])=>(
            <button key={t} style={S.nb(!newRound&&tab===t||newRound&&t==="ronda")} onClick={()=>go(t)}>{l}</button>
          ))}
          <button style={{...S.btn("g"),fontSize:"10px",padding:"5px 9px"}} onClick={()=>{lsSet("session",null);setUser(null)}}>Salir</button>
        </div>
      </div>
      {newRound
        ?<NewRound user={user} onSave={()=>{setNR(false);setTab("myrounds");if(user)lsSet("nav:"+user.username,{tab:"myrounds",newRound:false});}} onCancel={()=>{setNR(false);if(user)lsSet("nav:"+user.username,{tab,newRound:false});}}/>
        :tab==="stats"?<Stats user={user}/>
        :tab==="myrounds"?<MyRounds user={user}/>
        :tab==="coach"&&user.isCoach?<CoachPanel/>
        :tab==="canchas"?<MisCanchas user={user}/>
        :tab==="profile"?<Profile user={user} onUpdate={u=>setUser(u)}/>
        :null
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
