        <div>
          <label style={S.lbl}>Búnker</label>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:"8px",background:"#2a2318",border:"2px solid #7a6030",borderRadius:"4px",padding:"8px"}}>
            {!readonly
              ?<><button style={ctrBtn} onClick={()=>upd("bunker",Math.max(0,(parseInt(d.bunker)||0)-1))}>−</button>
                <span style={{color:"#f5ead0",fontSize:"24px",fontWeight:"bold",minWidth:"32px",textAlign:"center"}}>{d.bunker||0}</span>
                <button style={ctrBtn} onClick={()=>upd("bunker",(parseInt(d.bunker)||0)+1)}>+</button></>
              :<span style={{color:"#f5ead0",fontSize:"24px",fontWeight:"bold",textAlign:"center",width:"100%"}}>{d.bunker||0}</span>
            }
          </div>
        </div>
      </div>
      <div style={{marginBottom:"12px"}}>
        <label style={S.lbl}>Tiros al green</label>
        {tirosG.map((t,i)=>(
          <div key={i} style={{background:"#141210",border:"1px solid #5a4a20",borderRadius:"6px",padding:"10px",marginBottom:"8px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
              <span style={{color:gold,fontSize:"12px",fontWeight:"bold"}}>Tiro {i+1}</span>
              {!readonly&&<button style={{...S.btn("d"),padding:"4px 10px",fontSize:"11px"}} onClick={()=>removeTiro(i)}>✕</button>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"8px"}}>
              <div>
                <label style={S.lbl}>Dist (yds)</label>
                <input style={smInp} type="number" min="0" max="999" placeholder="—" value={t.dist||""} disabled={readonly} onChange={e=>updTiro(i,"dist",e.target.value)}/>
              </div>
              <div>
                <label style={S.lbl}>Palo</label>
                <input style={smInp} type="text" placeholder="7H, PW..." value={t.palo||""} disabled={readonly} onChange={e=>updTiro(i,"palo",e.target.value.toUpperCase())}/>
              </div>
            </div>
            <label style={S.lbl}>Resultado</label>
            <select value={t.resultado||""} disabled={readonly} onChange={e=>updTiro(i,"resultado",e.target.value)} style={{...S.inp,fontSize:"14px"}}>
              <option value="">—</option>
              <option value="green">🟢 Green</option>
              <option value="chip">🟡 Zona chip</option>
              <option value="bunker">🟤 Bunker</option>
              <option value="corto">❌ Corto</option>
              <option value="largo">❌ Largo</option>
              <option value="lateral">❌ Lateral</option>
            </select>
          </div>
        ))}
        {!readonly&&!greenCerrado&&(
          <button style={{...S.btn("g"),width:"100%",padding:"10px",fontSize:"13px"}} onClick={addTiro}>+ Agregar tiro al green</button>
        )}
        {readonly&&tirosG.length===0&&<div style={{color:"#b09050",fontSize:"11px",fontStyle:"italic"}}>{parseInt(d.par)===3?"Tiro directo (par 3)":"Sin tiros registrados"}</div>}
      </div>
      {(parseInt(d.putts)||0)>0&&(
        <div style={{marginBottom:"10px"}}>
          <label style={S.lbl}>Dist. primer putt (yds)</label>
          <input style={smInp} type="number" min="0" max="99" placeholder="—" value={d.distPutt1||""} disabled={readonly} onChange={e=>upd("distPutt1",e.target.value)}/>
        </div>
      )}

      {readonly&&hasNotes&&(
        <div style={{background:"#141210",border:"1px solid #5a4a20",borderRadius:"6px",padding:"12px",marginTop:"10px"}}>
          {d.salida&&<div style={{marginBottom:"6px"}}><span style={{color:"#b09050",fontSize:"11px"}}>Salida: </span><span style={{color:"#f5ead0",fontSize:"13px"}}>{d.salida}</span></div>}
          {ZONES.map(z=>d.zones?.[z]&&(<div key={z} style={{marginBottom:"6px"}}><span style={{color:"#b09050",fontSize:"11px"}}>{z}: </span><span style={{color:"#f5ead0",fontSize:"13px"}}>{d.zones[z]}</span></div>))}
          {d.note&&<div><span style={{color:"#b09050",fontSize:"11px"}}>Libre: </span><span style={{color:"#f5ead0",fontSize:"13px"}}>{d.note}</span></div>}
        </div>
      )}
    </div>
  );
}

function NewRound({user,onSave,onCancel,editRound}){
  const DRAFT_KEY="draft:"+user.username;
  // Check for existing draft on mount (not when editing a round)
  const existingDraft=editRound?null:lsGet(DRAFT_KEY);
  const [step,setStep]=useState(editRound?2:1);
  const [meta,setMeta]=useState(()=>{
    if(editRound)return{courseId:editRound.courseId||editRound.course_id||"",date:editRound.date,format:editRound.format,tipo:editRound.tipo||"Práctica",hcp:editRound.hcp||18,hcpT:editRound.hcpT||editRound.hcpt||"libre",numHoles:editRound.numHoles||editRound.num_holes||18,savedConfig:""};
    if(existingDraft)return existingDraft.meta;
    return{courseId:"",date:new Date().toISOString().slice(0,10),format:"Strokeplay",tipo:"Práctica",hcp:user.hcp||18,hcpT:user.hcpT||"libre",numHoles:18,savedConfig:""};
  });
  const [holes,setHoles]=useState(()=>editRound?{...editRound.holes}:existingDraft?existingDraft.holes:{});
  const [err,setErr]=useState("");
  const [saving,setSaving]=useState(false);
  const [savedConfigs,setSavedConfigs]=useState(()=>({...PRESET_CONFIGS,...(lsGet("configs:"+user.username)||{})}));
  const [showSaveCfg,setShowSaveCfg]=useState(false);
  const [cfgName,setCfgName]=useState("");
  const [showDraftBanner,setShowDraftBanner]=useState(()=>!!existingDraft);
  const [plan0,setPlan0]=useState(()=>editRound?.plan0||existingDraft?.plan0||{});
  const [showPlan0,setShowPlan0]=useState(false);
  const [recPlan,setRecPlan]=useState("idle");

  // Auto-save draft on every change
  useEffect(()=>{
    if(!meta.courseId)return; // no guardar si no eligió cancha aún
    lsSet(DRAFT_KEY,{meta,holes,plan0,savedAt:Date.now()});
  },[meta,holes,plan0]);

  function startVoicePlan(campo){
    if(!navigator.onLine){alert("📶 Sin conexión — el micrófono requiere internet.");return;}
    if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert("⚠️ Reconocimiento de voz no disponible en este dispositivo.");return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const rec=new SR();
    rec.lang="es-AR";rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;
    setRecPlan(campo);
    const timeout=setTimeout(()=>{try{rec.stop();}catch(e){}setRecPlan("error");setTimeout(()=>setRecPlan("idle"),2000);},10000);
    rec.onresult=e=>{clearTimeout(timeout);const txt=e.results[0][0].transcript;setPlan0(p=>({...p,[campo]:(p[campo]||"")+(p[campo]?" ":"")+txt}));setRecPlan("done");setTimeout(()=>setRecPlan("idle"),2000);};
    rec.onerror=()=>{clearTimeout(timeout);setRecPlan("error");setTimeout(()=>setRecPlan("idle"),2000);};
    rec.start();
  }

  function discardDraft(){
    lsSet(DRAFT_KEY,null);
    setMeta({courseId:"",date:new Date().toISOString().slice(0,10),format:"Strokeplay",tipo:"Práctica",hcp:user.hcp||18,hcpT:user.hcpT||"libre",numHoles:18,savedConfig:""});
    setHoles({});setPlan0({});
    setShowDraftBanner(false);
  }
  const course=COURSES.find(c=>c.id===meta.courseId);
  const holeCount=parseInt(meta.numHoles)||18;
  const totalShots=Object.values(holes).reduce((s,h)=>s+(parseInt(h.shots)||0),0);
  const totalPutts=Object.values(holes).reduce((s,h)=>s+(parseInt(h.putts)||0),0);
  const totalChips=Object.values(holes).reduce((s,h)=>s+(parseInt(h.chips)||0),0);
  const totalBunker=Object.values(holes).reduce((s,h)=>s+(parseInt(h.bunker)||0),0);
  const hasDist=Object.values(holes).some(h=>h.dist);
  const configsForCourse=Object.keys(savedConfigs).filter(k=>k.startsWith(meta.courseId+"|"));

  async function save(){
    if(!meta.courseId){setErr("Seleccioná una cancha.");return}
    // Validación por hoyo
    const avisos=[];
    for(let h=1;h<=holeCount;h++){
      const hd=holes[h]||{};
      if(!parseInt(hd.shots)){avisos.push(`Hoyo ${h}: falta cantidad de golpes`);continue;}
      if(parseInt(hd.putts)===""||hd.putts===""){avisos.push(`Hoyo ${h}: falta cantidad de putts`);}
      const par=parseInt(hd.par);
      const tirosG=hd.tirosGreen||[];
      if(par>=4){
        if(tirosG.length===0){avisos.push(`Hoyo ${h} (par ${par||"?"}): falta al menos un tiro al green`);}
        else{
          tirosG.forEach((t,i)=>{
            if(!t.dist)avisos.push(`Hoyo ${h} tiro ${i+1}: falta distancia`);
            if(!t.palo)avisos.push(`Hoyo ${h} tiro ${i+1}: falta palo`);
            if(!t.resultado)avisos.push(`Hoyo ${h} tiro ${i+1}: falta resultado (green/chip/búnker)`);
          });
        }
      }
      if(par===3&&tirosG.length>0){
        tirosG.forEach((t,i)=>{
          if(t.dist&&!t.palo)avisos.push(`Hoyo ${h} tiro ${i+1}: falta palo`);
          if(!t.resultado&&(t.dist||t.palo))avisos.push(`Hoyo ${h} tiro ${i+1}: falta resultado`);
        });
      }
    }
    if(avisos.length){setErr("Completá estos datos antes de guardar:\n• "+avisos.slice(0,5).join("\n• ")+(avisos.length>5?`\n• ...y ${avisos.length-5} más`:"")); return;}
    setSaving(true);
    try{
      const id=editRound?editRound.id:Date.now().toString();
      const createdAt=editRound?editRound.createdAt||editRound.created_at||Date.now():Date.now();
      const round={id,username:user.username,playerName:user.name,courseId:meta.courseId,courseName:course?.name,date:meta.date,format:meta.format,tipo:meta.tipo||"Práctica",hcp:parseFloat(meta.hcp)||0,hcpT:meta.hcpT,numHoles:holeCount,holes,plan0,totalShots,totalPutts,totalChips,totalBunker,createdAt};
      lsSet("round:"+id,round);
      if(!editRound){const idx=lsGet("rounds:"+user.username)||[];if(!idx.includes(id)){idx.push(id);lsSet("rounds:"+user.username,idx);}}
      // Mark as pending sync
      const pending=lsGet("pending:"+user.username)||[];if(!pending.includes(id)){pending.push(id);lsSet("pending:"+user.username,pending);}
      // Try to sync now
      const ok=await sbU("rounds",{id,username:user.username,player_name:user.name,course_id:meta.courseId,course_name:course?.name,date:meta.date,format:meta.format,tipo:meta.tipo||"Práctica",hcp:parseFloat(meta.hcp)||0,hcpt:meta.hcpT,num_holes:holeCount,holes,plan0:Object.keys(plan0||{}).length?plan0:null,total_shots:totalShots,total_putts:totalPutts,total_chips:totalChips,total_bunker:totalBunker,created_at:createdAt});
      if(ok){const p=lsGet("pending:"+user.username)||[];lsSet("pending:"+user.username,p.filter(x=>x!==id));}
      lsSet(DRAFT_KEY,null); // borrar borrador al guardar exitosamente
      onSave(editRound?round:null);
    }catch(e){setErr("Error al guardar. Intentá de nuevo.");}
    finally{setSaving(false);}
  }

  function saveConfig(){
    if(!cfgName.trim())return;
    const key=meta.courseId+"|"+Date.now();
    const holesOnly={};
    Object.entries(holes).forEach(([h,d])=>{holesOnly[h]={par:d.par,dist:d.dist}});
    const configs=lsGet("configs:"+user.username)||{};
    configs[key]={name:cfgName.trim(),courseId:meta.courseId,holes:holesOnly,savedAt:Date.now()};
    lsSet("configs:"+user.username,configs);setSavedConfigs({...PRESET_CONFIGS,...configs});setShowSaveCfg(false);
    alert("✓ Configuración guardada: "+cfgName.trim());
  }

  return(
    <div style={S.page}>
      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px"}}>
        <button style={S.btn("g")} onClick={()=>{lsSet(DRAFT_KEY,null);onCancel();}}>← Volver</button>
        <div style={{fontSize:"14px",color:gold,letterSpacing:"2px",textTransform:"uppercase"}}>{editRound?"✏️ Editar Vuelta":"Nueva Vuelta"}</div>
      </div>
      {showDraftBanner&&(
        <div style={{background:"#2a2010",border:"1px solid "+gold,borderRadius:"6px",padding:"12px",marginBottom:"14px"}}>
          <div style={{color:gold,fontSize:"13px",fontWeight:"bold",marginBottom:"6px"}}>📋 Tenés una tarjeta sin terminar</div>
          <div style={{color:"#f5ead0",fontSize:"12px",marginBottom:"10px"}}>
            {existingDraft?.meta?.courseId?`Cancha: ${COURSES.find(c=>c.id===existingDraft.meta.courseId)?.name||existingDraft.meta.courseId}`:""}{existingDraft?.meta?.date?` · ${existingDraft.meta.date}`:""}
          </div>
          <div style={{display:"flex",gap:"8px"}}>
            <button style={{...S.btn("p"),flex:1}} onClick={()=>setShowDraftBanner(false)}>Continuar cargando</button>
            <button style={{...S.btn("d"),flex:1}} onClick={discardDraft}>Descartar y empezar de cero</button>
          </div>
        </div>
      )}
      {step===1&&(
        <div style={S.card}>
          <div style={S.h2}>Datos de la vuelta</div>
          {err&&<div style={S.alt("e")}>{err}</div>}
          <label style={S.lbl}>Cancha</label>
          <select style={{...S.sel,marginBottom:"11px"}} value={meta.courseId} onChange={e=>{
            const cid=e.target.value;
            const allCfgs={...PRESET_CONFIGS,...(lsGet("configs:"+user.username)||{})};
            setSavedConfigs(allCfgs);
            const cfgsForNew=Object.keys(allCfgs).filter(k=>k.startsWith(cid+"|"));
            if(cfgsForNew.length===1){
              // única config: cargar automáticamente
              const cfg=allCfgs[cfgsForNew[0]];
              const newH={};
              Object.entries(cfg.holes||{}).forEach(([h,d])=>{newH[h]={...d,shots:"",putts:"",chips:0,bunker:0,yards:"",salida:"",zones:{},note:""}});
              setHoles(newH);setMeta(m=>({...m,courseId:cid,savedConfig:cfgsForNew[0],numHoles:Object.keys(cfg.holes||{}).length}));
            }else{
              setHoles({});setMeta(m=>({...m,courseId:cid,savedConfig:"",numHoles:18}));
            }
          }}>
            <option value="">Seleccioná una cancha</option>
            {COURSES.map(c=><option key={c.id} value={c.id}>{c.name} — {c.city}</option>)}
          </select>
          {meta.courseId&&configsForCourse.length>1&&(
            <div style={{marginBottom:"11px"}}>
              <label style={S.lbl}>Elegí el tee</label>
              <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
                {configsForCourse.map(k=>{
                  const cfg=savedConfigs[k];
                  const label=cfg.name.replace(/^.*?(Azul|Blanca|Damas|Roja|Amarilla|Negra|Blanco|Rojo|Amarillo|Negro)/i,"$1")||cfg.name;
                  const active=meta.savedConfig===k;
                  return(
                    <button key={k} style={{...S.btn(active?"p":"g"),minWidth:"70px"}} onClick={()=>{
                      const newH={};
                      Object.entries(cfg.holes||{}).forEach(([h,d])=>{newH[h]={...d,shots:"",putts:"",chips:0,bunker:0,yards:"",salida:"",zones:{},note:""}});
                      setHoles(newH);setMeta(m=>({...m,savedConfig:k,numHoles:Object.keys(cfg.holes||{}).length}));
                    }}>{label}</button>
                  );
                })}
              </div>
            </div>
          )}
          <label style={S.lbl}>Cantidad de hoyos</label>
          <input style={{...S.inp,marginBottom:"11px"}} type="number" min="1" max="36" value={meta.numHoles} onChange={e=>setMeta(m=>({...m,numHoles:e.target.value}))}/>
          <label style={S.lbl}>Fecha</label>
          <input style={{...S.inp,marginBottom:"11px"}} type="date" value={meta.date} onChange={e=>setMeta(m=>({...m,date:e.target.value}))}/>
          <label style={S.lbl}>Formato</label>
          <select style={{...S.sel,marginBottom:"11px"}} value={meta.format} onChange={e=>setMeta(m=>({...m,format:e.target.value}))}>
            {(user.isCoach?FORMATS_ALL:FORMATS_A).map(f=><option key={f}>{f}</option>)}
          </select>
          <label style={S.lbl}>Tipo de vuelta</label>
          <select style={{...S.sel,marginBottom:"11px"}} value={meta.tipo} onChange={e=>setMeta(m=>({...m,tipo:e.target.value}))}>
            <option>Práctica</option><option>Competitiva</option>
          </select>
          <div style={{...S.g2,marginBottom:"11px"}}>
            <div><label style={S.lbl}>Handicap</label><input style={S.inp} type="number" min="0" max="54" value={meta.hcp} onChange={e=>setMeta(m=>({...m,hcp:e.target.value}))}/></div>
            <div><label style={S.lbl}>Tipo</label>
              <select style={S.sel} value={meta.hcpT} onChange={e=>setMeta(m=>({...m,hcpT:e.target.value}))}>
                <option value="libre">Libre</option><option value="aag">Oficial AAG</option>
              </select>
            </div>
          </div>
          <button style={{...S.btn("p"),width:"100%",padding:"12px"}} onClick={()=>{if(!meta.courseId){setErr("Seleccioná una cancha.");return}setErr("");setStep(2)}}>Ir a la tarjeta →</button>
        </div>
      )}
      {step===2&&(
        <div style={S.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px",flexWrap:"wrap",gap:"6px"}}>
            <div>
              <div style={{color:gold,fontSize:"14px",fontWeight:"bold"}}>{course?.name}</div>
              <div style={{color:"#b09050",fontSize:"11px"}}>{meta.date} · {meta.format} · HCP {meta.hcp}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{color:gold,fontSize:"24px",fontWeight:"bold"}}>{totalShots||"—"}</div>
              <div style={{color:"#b09050",fontSize:"10px"}}>{totalPutts} putts · {totalChips} chips · {totalBunker} búnker</div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"14px"}}>
            <label style={{...S.lbl,marginBottom:0}}>Hoyos:</label>
            <input style={{...S.inp,width:"70px",textAlign:"center"}} type="number" min="1" max="36" value={meta.numHoles} onChange={e=>setMeta(m=>({...m,numHoles:e.target.value}))}/>
          </div>
          {err&&<div style={S.alt("e")}>{err}</div>}

          {/* Hoyo 0 — Plan de juego pre-ronda */}
          <div style={{background:"#141210",border:`1px solid ${showPlan0?"#9a7030":"#5a4a20"}`,borderRadius:"8px",padding:"14px",marginBottom:"14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{color:gold,fontWeight:"bold",fontSize:"15px",letterSpacing:"1px"}}>HOYO 0 — Plan Pre-Ronda</div>
                <div style={{color:"#b09050",fontSize:"11px"}}>Calentamiento y estrategia antes de salir</div>
              </div>
              <button style={{...S.btn("g"),padding:"7px 12px",fontSize:"12px"}} onClick={()=>setShowPlan0(o=>!o)}>
                {showPlan0?"▲ Cerrar":"📋 Abrir"}
              </button>
            </div>
            {showPlan0&&(
              <div style={{marginTop:"14px"}}>
                {ZONES.map((z,zi)=>(
                  <div key={z} style={{marginBottom:"12px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px"}}>
                      <label style={{...S.lbl,marginBottom:0,flex:1}}>{z}</label>
                      {voiceBtn(recPlan,"plan_z"+zi,()=>startVoicePlan("zona_"+zi),false)}
                    </div>
                    <textarea style={{...S.inp,minHeight:"52px",resize:"vertical"}}
                      placeholder={`Plan para ${z.toLowerCase()}...`}
                      value={plan0["zona_"+zi]||""} onChange={e=>setPlan0(p=>({...p,["zona_"+zi]:e.target.value}))}/>
                  </div>
                ))}
                <div style={{marginBottom:"4px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px"}}>
                    <label style={{...S.lbl,marginBottom:0,flex:1}}>Estrategia global</label>
                    {voiceBtn(recPlan,"plan_eg",()=>startVoicePlan("estrategiaGlobal"),false)}
                  </div>
                  <textarea style={{...S.inp,minHeight:"60px",resize:"vertical"}}
                    placeholder="Mi estrategia general para hoy..."
                    value={plan0.estrategiaGlobal||""} onChange={e=>setPlan0(p=>({...p,estrategiaGlobal:e.target.value}))}/>
                </div>
              </div>
            )}
          </div>

          {Array.from({length:holeCount},(_,i)=>i+1).map(h=>(
            <HoleCard key={h} hole={h} data={holes[h]} onChange={d=>setHoles(p=>({...p,[h]:d}))} readonly={false}/>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",padding:"12px 0",borderTop:"2px solid #7a6030",marginTop:"6px"}}>
            <div style={{color:"#b09050",fontSize:"12px"}}>Putts: <span style={{color:"#f5ead0"}}>{totalPutts||"—"}</span> · Chips: <span style={{color:"#f5ead0"}}>{totalChips}</span> · Búnker: <span style={{color:"#f5ead0"}}>{totalBunker}</span></div>
            <div style={{color:gold,fontSize:"14px",fontWeight:"bold"}}>Total: {totalShots||"—"}</div>
          </div>
          {hasDist&&(
            <div style={{marginTop:"10px"}}>
              {!showSaveCfg
                ?<button style={{...S.btn("g"),width:"100%",padding:"10px"}} onClick={()=>{setShowSaveCfg(true);setCfgName(course?.name||"");}}>💾 Guardar configuración de cancha</button>
                :<div style={{background:"#141210",border:"1px solid #5a4a20",borderRadius:"6px",padding:"12px"}}>
                  <label style={S.lbl}>Nombre de la configuración</label>
                  <input style={{...S.inp,marginBottom:"8px"}} placeholder="Ej: Cañuelas Roja, Hurlingham Azul..." value={cfgName} onChange={e=>setCfgName(e.target.value)}/>
                  <div style={{display:"flex",gap:"8px"}}>
                    <button style={S.btn("g")} onClick={()=>setShowSaveCfg(false)}>Cancelar</button>
                    <button style={{...S.btn("p"),flex:1}} onClick={saveConfig}>Guardar</button>
                  </div>
                </div>
              }
            </div>
          )}
          <div style={{display:"flex",gap:"8px",marginTop:"12px"}}>
            <button style={S.btn("g")} onClick={()=>setStep(1)}>← Atrás</button>
            <button style={{...S.btn("p"),flex:1,padding:"11px"}} onClick={save} disabled={saving}>{saving?"Guardando...":"Guardar vuelta ✓"}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function RoundDetail({round,onBack,coachView,onRoundUpdated}){
  const course=COURSES.find(c=>c.id===round.courseId||c.id===round.course_id);
  const count=round.numHoles||round.num_holes||course?.holes||Object.keys(round.holes||{}).length||18;
  const is18=count===18;
  const [editing,setEditing]=useState(false);
  const [holes,setHoles]=useState(()=>{
    const h={};
    for(let i=1;i<=count;i++){
      const d=round.holes?.[i]||round.holes?.[String(i)]||{};
      h[i]={...d};
    }
    return h;
  });
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState("");

  // Subtotales IDA/VUELTA
  function subTotal(from,to){
    let t=0;
    for(let h=from;h<=to;h++) t+=parseInt(holes[h]?.shots||0);
    return t||"—";
  }
  const ida=is18?subTotal(1,9):"—";
  const vuelta=is18?subTotal(10,18):"—";
  // Stats de putting de esta vuelta
  const dp1thisRound=(()=>{
    const vals=[];
    for(let h=1;h<=count;h++){const v=parseFloat(holes[h]?.distPutt1);if(v>0)vals.push(v);}
    return vals;
  })();
  const avgDP1this=dp1thisRound.length?(dp1thisRound.reduce((a,b)=>a+b,0)/dp1thisRound.length).toFixed(1):null;
  const totalDP1this=dp1thisRound.length?dp1thisRound.reduce((a,b)=>a+b,0):null;

  async function saveAnalytics(){
    setSaving(true);setMsg("");
    try{
      // Merge edited analytics fields back into round
      const newHoles={};
      for(let h=1;h<=count;h++){
        const orig=round.holes?.[h]||round.holes?.[String(h)]||{};
        const ed=holes[h]||{};
        newHoles[h]={...orig,yards:ed.yards||orig.yards||"",palo:ed.palo||orig.palo||"",distPutt1:ed.distPutt1||orig.distPutt1||""};
      }
      const id=round.id;
      // Update localStorage
      const local=lsGet("round:"+id);
      if(local){
        local.holes=newHoles;
        lsSet("round:"+id,local);
      }
      // Update Supabase
      const totalShots=round.totalShots||round.total_shots||0;
      const totalPutts=round.totalPutts||round.total_putts||0;
      const totalChips=round.totalChips||round.total_chips||0;
      const totalBunker=round.totalBunker||round.total_bunker||0;
      await sbU("rounds",{id,username:round.username,player_name:round.playerName||round.player_name,course_id:round.courseId||round.course_id,course_name:round.courseName||round.course_name,date:round.date,format:round.format,tipo:round.tipo||"Práctica",hcp:round.hcp||0,hcpt:round.hcpT||round.hcpt||"libre",num_holes:count,holes:newHoles,total_shots:totalShots,total_putts:totalPutts,total_chips:totalChips,total_bunker:totalBunker,created_at:round.createdAt||round.created_at||Date.now()});
      setHoles(newHoles);
      setEditing(false);
      setMsg("✓ Datos actualizados.");
      if(onRoundUpdated)onRoundUpdated({...round,holes:newHoles});
    }catch(e){setMsg("Error al guardar. Intentá de nuevo.");}
    finally{setSaving(false);}
  }

  // For editing: only analytics fields are editable
  function updAnalytic(h,k,v){
    setHoles(p=>({...p,[h]:{...p[h],[k]:v}}));
  }

  const totalShots=round.totalShots||round.total_shots||0;
  const totalPutts=round.totalPutts||round.total_putts||0;
  const totalChips=round.totalChips||round.total_chips||0;
  const totalBunker=round.totalBunker||round.total_bunker||0;

  return(
    <div style={S.page}>
      <button style={{...S.btn("g"),marginBottom:"12px"}} onClick={onBack}>← Volver</button>
      <div style={S.card}>
        <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:"8px",marginBottom:"12px"}}>
          <div>
            <div style={{color:gold,fontSize:"14px",fontWeight:"bold"}}>{round.courseName||round.course_name}</div>
            <div style={{color:"#b09050",fontSize:"11px"}}>{round.date} · {round.format} · {count} hoyos{round.tipo&&round.tipo!=="Práctica"?<span style={{marginLeft:"6px",background:"#1a3a1a",color:"#6abf6a",border:"1px solid #2a5a2a",borderRadius:"4px",padding:"1px 5px",fontSize:"10px"}}>🏆 Competitiva</span>:null}</div>
            {coachView&&<div style={{color:"#b09050",fontSize:"11px"}}>Jugador: <span style={{color:"#f5ead0"}}>{round.playerName||round.player_name}</span></div>}
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{color:gold,fontSize:"28px",fontWeight:"bold"}}>{totalShots}</div>
            {is18&&(
              <div style={{color:"#b09050",fontSize:"11px"}}>
                <span style={{color:"#f5ead0",fontWeight:"bold"}}>{ida}</span> IDA · <span style={{color:"#f5ead0",fontWeight:"bold"}}>{vuelta}</span> VUELTA
              </div>
            )}
            <div style={{color:"#b09050",fontSize:"11px"}}>{totalPutts} putts · {totalChips} chips · {totalBunker} búnker</div>
            <div style={{color:"#b09050",fontSize:"11px"}}>Neto: {totalShots-(round.hcp||0)}</div>
            {avgDP1this&&<div style={{color:"#b09050",fontSize:"11px",marginTop:"3px"}}>Prom. 1er putt <span style={{color:"#f5ead0"}}>{avgDP1this} yds</span> · Total <span style={{color:"#f5ead0"}}>{totalDP1this} yds</span></div>}
          </div>
        </div>

        {msg&&<div style={msg.startsWith("✓")?{...S.card,background:"#1a2a1a",border:"1px solid #2a5a2a",color:"#8e8",fontSize:"13px",marginBottom:"10px"}:S.alt("e")}>{msg}</div>}

        {!coachView&&(
          <div style={{marginBottom:"14px"}}>
            {!editing
              ?<button style={{...S.btn("g"),width:"100%",padding:"10px"}} onClick={()=>{setEditing(true);setMsg("");}}>✎ Completar datos (palo / distancias)</button>
              :<div style={{...S.card,background:"#141210",padding:"10px",marginBottom:"0"}}>
                <div style={{color:gold,fontSize:"11px",letterSpacing:"1px",marginBottom:"6px"}}>Editando: palo, dist. tiro a green y dist. primer putt</div>
                <div style={{color:"#b09050",fontSize:"10px",marginBottom:"10px"}}>Score, putts, chips y búnker no se pueden modificar.</div>
                <div style={{display:"flex",gap:"8px"}}>
                  <button style={S.btn("g")} onClick={()=>{setEditing(false);setMsg("");}}>Cancelar</button>
                  <button style={{...S.btn("p"),flex:1}} onClick={saveAnalytics} disabled={saving}>{saving?"Guardando...":"Guardar cambios ✓"}</button>
                </div>
              </div>
            }
          </div>
        )}

        {Array.from({length:count},(_,i)=>i+1).map(h=>{
          const d=holes[h]||{};
          if(!editing){
            return(
              <React.Fragment key={h}>
                {is18&&h===10&&(
                  <div style={{background:"#2a2318",border:"1px solid #7a6030",borderRadius:"6px",padding:"10px 14px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{color:"#b09050",fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase"}}>IDA (1–9)</div>
                    <div style={{color:gold,fontSize:"20px",fontWeight:"bold"}}>{ida}</div>
                  </div>
                )}
                <HoleCard key={h} hole={h} data={d} onChange={()=>{}} readonly/>
                {is18&&h===18&&(
                  <div style={{background:"#2a2318",border:"1px solid #7a6030",borderRadius:"6px",padding:"10px 14px",marginTop:"4px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{color:"#b09050",fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase"}}>VUELTA (10–18)</div>
                    <div style={{color:gold,fontSize:"20px",fontWeight:"bold"}}>{vuelta}</div>
                  </div>
                )}
              </React.Fragment>
            );
          }
          // Editing mode: show analytics fields only
          const smInp={...S.inp,fontSize:"15px",padding:"9px",textAlign:"center"};
          return(
            <React.Fragment key={h}>
              {is18&&h===10&&(
                <div style={{background:"#2a2318",border:"1px solid #7a6030",borderRadius:"6px",padding:"10px 14px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{color:"#b09050",fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase"}}>IDA (1–9)</div>
                  <div style={{color:gold,fontSize:"20px",fontWeight:"bold"}}>{ida}</div>
                </div>
              )}
              <div style={{background:"#1c1810",border:"1px solid #5a4a20",borderRadius:"8px",padding:"14px",marginBottom:"12px"}}>
                <div style={{color:gold,fontWeight:"bold",fontSize:"16px",letterSpacing:"2px",marginBottom:"10px",borderBottom:"1px solid #5a4a20",paddingBottom:"8px"}}>
                  HOYO {h}
                  <span style={{color:"#b09050",fontSize:"11px",fontWeight:"normal",marginLeft:"10px"}}>{d.shots||"—"} golpes · {d.putts||"—"} putts</span>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}}>
                  <div>
                    <label style={S.lbl}>Dist. tiro a green (yds)</label>
                    <input style={smInp} type="number" min="0" max="999" placeholder="—" value={d.yards||""} onChange={e=>updAnalytic(h,"yards",e.target.value)}/>
                  </div>
                  <div>
                    <label style={S.lbl}>Palo escogido</label>
                    <input style={smInp} type="text" placeholder="7H, PW..." value={d.palo||""} onChange={e=>updAnalytic(h,"palo",e.target.value)}/>
                  </div>
                </div>
                {(parseInt(d.putts)||0)>0&&(
                  <div>
                    <label style={S.lbl}>Dist. primer putt (yds)</label>
                    <input style={smInp} type="number" min="0" max="99" placeholder="—" value={d.distPutt1||""} onChange={e=>updAnalytic(h,"distPutt1",e.target.value)}/>
                  </div>
                )}
              </div>
              {is18&&h===18&&(
                <div style={{background:"#2a2318",border:"1px solid #7a6030",borderRadius:"6px",padding:"10px 14px",marginTop:"4px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{color:"#b09050",fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase"}}>VUELTA (10–18)</div>
                  <div style={{color:gold,fontSize:"20px",fontWeight:"bold"}}>{vuelta}</div>
                </div>
              )}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

function MyRounds({user}){
  const [rounds,setRounds]=useState([]);
  const [selected,setSelected]=useState(null);
  const [editing,setEditing]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{loadRounds();},[]);

  async function syncPending(){
    const pending=lsGet("pending:"+user.username)||[];
    if(!pending.length)return;
    const synced=[];
    for(const id of pending){
      const r=lsGet("round:"+id);
      if(!r)continue;
      const ok=await sbU("rounds",{id,username:r.username,player_name:r.playerName,course_id:r.courseId,course_name:r.courseName,date:r.date,format:r.format,tipo:r.tipo||"Práctica",hcp:r.hcp||0,hcpt:r.hcpT,num_holes:r.numHoles||18,holes:r.holes,total_shots:r.totalShots||0,total_putts:r.totalPutts||0,total_chips:r.totalChips||0,total_bunker:r.totalBunker||0,created_at:r.createdAt||Date.now()});
      if(ok)synced.push(id);
    }
    if(synced.length){
      const remaining=pending.filter(id=>!synced.includes(id));
      lsSet("pending:"+user.username,remaining);
    }
    return synced.length;
  }

  async function loadRounds(){
    setLoading(true);
    // First sync any pending local rounds
    await syncPending();
    try{
      const sb=await sbQ(`rounds?username=eq.${user.username}&order=created_at.desc`);
      if(sb&&sb.length){
        // Also merge any local rounds not yet in Supabase
        const sbIds=new Set(sb.map(r=>r.id));
        const localIdx=lsGet("rounds:"+user.username)||[];
        const localOnly=localIdx.map(id=>lsGet("round:"+id)).filter(r=>r&&!sbIds.has(r.id));
        setRounds([...sb,...localOnly].sort((a,b)=>(b.created_at||b.createdAt||0)-(a.created_at||a.createdAt||0)));
      }else{
        const idx=lsGet("rounds:"+user.username)||[];
        const loaded=idx.map(id=>lsGet("round:"+id)).filter(Boolean);
        loaded.sort((a,b)=>b.createdAt-a.createdAt);
        setRounds(loaded);
      }
    }catch{
      const idx=lsGet("rounds:"+user.username)||[];
      setRounds(idx.map(id=>lsGet("round:"+id)).filter(Boolean));
    }
    setLoading(false);
  }

  const getShots=r=>r.totalShots||r.total_shots||0;
  const getPutts=r=>r.totalPutts||r.total_putts||0;
  const getChips=r=>r.totalChips||r.total_chips||0;
  const getHcp=r=>r.hcp||0;
  const getHoles=r=>parseInt(r.numHoles||r.num_holes)||18;
  const getName=r=>r.courseName||r.course_name||"";

  function getIdaVuelta(r){
    const h=r.holes||{};
    let ida=0,vuelta=0;
    for(let i=1;i<=9;i++) ida+=parseInt(h[i]?.shots||h[String(i)]?.shots||0);
    for(let i=10;i<=18;i++) vuelta+=parseInt(h[i]?.shots||h[String(i)]?.shots||0);
    return{ida:ida||null,vuelta:vuelta||null};
  }

  if(editing)return <NewRound user={user} editRound={editing} onCancel={()=>setEditing(null)} onSave={(updated)=>{
    if(updated)setRounds(prev=>prev.map(r=>r.id===updated.id?{...r,...updated}:r));
    setEditing(null);
  }}/>;

  if(selected)return <RoundDetail round={selected} onBack={()=>setSelected(null)} onRoundUpdated={updated=>{
    setRounds(prev=>prev.map(r=>r.id===updated.id?{...r,...updated}:r));
    setSelected(s=>({...s,...updated}));
  }}/>;

  return(
    <div style={S.page}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
        <div style={S.h2}>Mis Vueltas</div>
        <button style={{...S.btn("g"),fontSize:"11px",padding:"7px 12px"}} onClick={loadRounds}>⟳ Actualizar</button>
      </div>
      {(lsGet("pending:"+user.username)||[]).length>0&&(
        <div style={{...S.alt("e"),fontSize:"12px"}}>
          ⚠️ Tenés {(lsGet("pending:"+user.username)||[]).length} vuelta(s) sin sincronizar. Tocá "Actualizar" cuando tengas conexión.
        </div>
      )}
      {loading&&<div style={{color:"#b09050",textAlign:"center",padding:"20px"}}>Cargando...</div>}
      {!loading&&rounds.length===0&&(
        <div style={{...S.card,textAlign:"center",color:"#b09050",padding:"40px 20px"}}>
          <div style={{fontSize:"32px",marginBottom:"10px"}}>⛳</div>
          <div>Todavía no registraste ninguna vuelta.</div>
        </div>
      )}
      {rounds.map(r=>{
        const is18=getHoles(r)===18;
        const {ida,vuelta}=is18?getIdaVuelta(r):{ida:null,vuelta:null};
        const dp1r=(()=>{const vals=[];Object.values(r.holes||{}).forEach(h=>{const v=parseFloat(h.distPutt1);if(v>0)vals.push(v);});return vals;})();
        const avgDP1r=dp1r.length?(dp1r.reduce((a,b)=>a+b,0)/dp1r.length).toFixed(1):null;
        const totDP1r=dp1r.length?dp1r.reduce((a,b)=>a+b,0):null;
        return(
          <div key={r.id} style={{...S.card,cursor:"pointer"}} onClick={()=>setSelected(r)}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{color:"#f5ead0",fontWeight:"bold",marginBottom:"3px"}}>{getName(r)}</div>
                <div style={{color:"#b09050",fontSize:"11px"}}>{r.date} · {r.format} · {getHoles(r)} hoyos{r.tipo&&r.tipo!=="Práctica"?<span style={{marginLeft:"6px",background:"#1a3a1a",color:"#6abf6a",border:"1px solid #2a5a2a",borderRadius:"4px",padding:"1px 5px",fontSize:"10px"}}>🏆 Competitiva</span>:null}</div>
                <div style={{color:"#b09050",fontSize:"11px"}}>HCP {getHcp(r)} ({r.hcpT||r.hcpt||"libre"})</div>
                {is18&&ida&&vuelta&&(
                  <div style={{color:"#b09050",fontSize:"11px",marginTop:"2px"}}>
                    IDA <span style={{color:"#f5ead0",fontWeight:"bold"}}>{ida}</span> · VUELTA <span style={{color:"#f5ead0",fontWeight:"bold"}}>{vuelta}</span>
                  </div>
                )}
                {avgDP1r&&<div style={{color:"#b09050",fontSize:"11px",marginTop:"2px"}}>1er putt <span style={{color:"#f5ead0"}}>{avgDP1r} yds</span> · recorrido <span style={{color:"#f5ead0"}}>{totDP1r} yds</span></div>}
              </div>
              <div style={{textAlign:"right",display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"4px"}}>
                <div style={{color:gold,fontSize:"22px",fontWeight:"bold"}}>{getShots(r)}</div>
                <div style={{color:"#b09050",fontSize:"11px"}}>{getPutts(r)} putts · {getChips(r)} chips</div>
                <div style={{color:"#b09050",fontSize:"11px"}}>Neto: {getShots(r)-getHcp(r)}</div>
                <button style={{...S.btn("g"),fontSize:"10px",padding:"4px 8px",marginTop:"4px"}}
                  onClick={e=>{e.stopPropagation();setEditing({...r,holes:r.holes||{}});}}>✏️ Editar</button>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Stats({user}){
  const [allRounds,setAllRounds]=useState([]);
  const [filtro,setFiltro]=useState(null);
  const [selected,setSelected]=useState({});

  useEffect(()=>{
    (async()=>{
      // Subir pendientes offline antes de cargar stats
      const pending=lsGet("pending:"+user.username)||[];
      if(pending.length&&navigator.onLine){
        const synced=[];
        for(const id of pending){
          const r=lsGet("round:"+id);
          if(!r)continue;
          const ok=await sbU("rounds",{id,username:r.username,player_name:r.playerName,course_id:r.courseId,course_name:r.courseName,date:r.date,format:r.format,tipo:r.tipo||"Práctica",hcp:r.hcp||0,hcpt:r.hcpT,num_holes:r.numHoles||18,holes:r.holes,total_shots:r.totalShots||0,total_putts:r.totalPutts||0,total_chips:r.totalChips||0,total_bunker:r.totalBunker||0,created_at:r.createdAt||Date.now()});
          if(ok)synced.push(id);
        }
        if(synced.length){const remaining=pending.filter(id=>!synced.includes(id));lsSet("pending:"+user.username,remaining);}
      }
      try{
        const sb=await sbQ(`rounds?username=eq.${user.username}&order=created_at.desc`);
        if(sb&&sb.length){
          const mapped=sb.map(r=>({id:r.id,courseName:r.course_name,date:r.date,numHoles:r.num_holes||18,totalShots:r.total_shots||0,totalPutts:r.total_putts||0,totalChips:r.total_chips||0,totalBunker:r.total_bunker||0,hcp:r.hcp||0,holes:r.holes||{}}));
          setAllRounds(mapped);
        }else{
          const idx=lsGet("rounds:"+user.username)||[];
          const local=idx.map(id=>lsGet("round:"+id)).filter(Boolean);
          local.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
          setAllRounds(local);
        }
      }catch{
        const idx=lsGet("rounds:"+user.username)||[];
        setAllRounds(idx.map(id=>lsGet("round:"+id)).filter(Boolean));
      }
    })();
  },[]);

  const holeCounts=useMemo(()=>[...new Set(allRounds.map(r=>r.numHoles||18))].sort((a,b)=>a-b),[allRounds]);
  const activeFiltro=filtro??holeCounts[0]??null;
  function getFiltered(){
    if(activeFiltro==="seleccionar"){
      const sel=allRounds.filter(r=>selected[r.id]);
      return sel.length?sel:allRounds;
    }
    if(activeFiltro!=null)return allRounds.filter(r=>(r.numHoles||18)===activeFiltro);
    return allRounds;
  }
  const rounds=getFiltered();

  return(
    <div style={S.page}>
      <div style={S.h2}>Mis Estadísticas</div>
      {allRounds.length>0&&(
        <div style={{...S.card,marginBottom:"14px",padding:"12px"}}>
          <div style={{color:"#b09050",fontSize:"10px",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"8px"}}>Ver estadísticas de</div>
          <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
            {holeCounts.map(h=>(
              <button key={h} style={S.nb(activeFiltro===h)} onClick={()=>{setFiltro(h);setSelected({});}}>{h} hoyos</button>
            ))}
            <button style={S.nb(activeFiltro==="seleccionar")} onClick={()=>{setFiltro("seleccionar");setSelected({});}}>Seleccionar</button>
          </div>
          {filtro==="seleccionar"&&(
            <div style={{marginTop:"10px"}}>
              <div style={{color:"#b09050",fontSize:"10px",marginBottom:"7px"}}>Marcá las vueltas que querés incluir:</div>
              {allRounds.map(r=>{
                const nombre=r.courseName||r.course_name||"Sin nombre";
                const fecha=r.date||"";
                return(
                  <label key={r.id} style={{display:"flex",alignItems:"center",gap:"10px",padding:"7px 0",borderBottom:"1px solid #3a3020",cursor:"pointer"}}>
                    <input type="checkbox" checked={!!selected[r.id]} onChange={e=>setSelected(p=>({...p,[r.id]:e.target.checked}))} style={{width:"16px",height:"16px",accentColor:gold}}/>
                    <div>
                      <div style={{color:"#f5ead0",fontSize:"12px"}}>{nombre}</div>
                      <div style={{color:"#b09050",fontSize:"10px"}}>{fecha} · {r.numHoles||18} hoyos · {r.totalShots||"—"} golpes</div>
                    </div>
                  </label>
                );
              })}
              {Object.values(selected).every(v=>!v)&&<div style={{color:"#b09050",fontSize:"11px",marginTop:"6px",fontStyle:"italic"}}>Sin selección → se muestran todas.</div>}
            </div>
          )}
        </div>
      )}
      <StatsView rounds={rounds} hcp={user.hcp} isCoach={false}/>
    </div>
  );
}

function Profile({user,onUpdate}){

  const [notas,setNotas]=useState(()=>lsGet("notas:"+user.username)||{});

function MisCanchas({user}){
  const [configs,setConfigs]=useState(()=>lsGet("configs:"+user.username)||{});
  const [courseId,setCourseId]=useState("");
  const [cfgName,setCfgName]=useState("");
  const [hoyos,setHoyos]=useState({});
  const [numHoles,setNumHoles]=useState(18);
  const [editKey,setEditKey]=useState(null); // key being edited
  const [msg,setMsg]=useState("");

  function loadConfig(key){
    const cfg=configs[key]||PRESET_CONFIGS[key];
    if(!cfg)return;
    setCourseId(cfg.courseId);
    setCfgName(cfg.name);
    setNumHoles(Object.keys(cfg.holes||{}).length||18);
    setHoyos(cfg.holes||{});
    setEditKey(key);
    setMsg("");
  }

  function newConfig(){
    setCourseId("");setCfgName("");setHoyos({});setNumHoles(18);setEditKey(null);setMsg("");
  }

  function saveConfig(){
    if(!courseId){setMsg("Seleccioná una cancha.");return}
    if(!cfgName.trim()){setMsg("Ingresá un nombre para la configuración.");return}
    const key=editKey||(courseId+"|"+Date.now());
    const holesOnly={};
    for(let h=1;h<=parseInt(numHoles)||18;h++){
      const d=hoyos[h]||{};
      holesOnly[h]={par:d.par||"",dist:d.dist||"",hcpIdx:d.hcpIdx||""};
    }
    const c=lsGet("configs:"+user.username)||{};
    c[key]={name:cfgName.trim(),courseId,holes:holesOnly,savedAt:Date.now()};
    lsSet("configs:"+user.username,c);
    setConfigs({...c});
    setEditKey(key);
    setMsg("✓ Configuración guardada: "+cfgName.trim());
  }

  function saveAs(){
    setCfgName(cfgName+" (copia)");
    setEditKey(null);
    setMsg("");
  }

  function deleteConfig(key){
    const c=lsGet("configs:"+user.username)||{};
    delete c[key];lsSet("configs:"+user.username,c);
    setConfigs({...c});
    if(editKey===key)newConfig();
    setMsg("");
  }

  const course=COURSES.find(c=>c.id===courseId);
  const holeCount=parseInt(numHoles)||18;

  return(
    <div style={S.page}>
      <div style={S.h2}>Mis Canchas</div>

      {/* Lista de configs — presets + propias */}
      {(()=>{
        const allKeys=[...Object.keys(PRESET_CONFIGS),...Object.keys(configs)];
        if(!allKeys.length)return null;
        return(
          <div style={{...S.card,marginBottom:"14px"}}>
            <div style={{color:gold,fontSize:"11px",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"10px"}}>Configuraciones disponibles</div>
            {allKeys.map(k=>{
              const isPreset=!!PRESET_CONFIGS[k];
              const cfg=isPreset?PRESET_CONFIGS[k]:configs[k];
              const c=COURSES.find(x=>x.id===cfg.courseId);
              return(
                <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:"1px solid #3a3020"}}>
                  <div style={{flex:1,cursor:"pointer"}} onClick={()=>loadConfig(k)}>
                    <div style={{color:editKey===k?gold:"#f5ead0",fontSize:"13px",fontWeight:editKey===k?"bold":"normal"}}>
                      {cfg.name}{editKey===k?" ✎":""}
                      {isPreset&&<span style={{marginLeft:"6px",fontSize:"9px",color:"#6a9a50",border:"1px solid #3a6a2a",borderRadius:"3px",padding:"1px 4px"}}>APP</span>}
                    </div>
                    <div style={{color:"#b09050",fontSize:"10px"}}>{c?.name||cfg.courseId} · {Object.keys(cfg.holes||{}).length} hoyos</div>
                  </div>
                  <div style={{display:"flex",gap:"6px"}}>
                    <button style={{...S.btn("g"),fontSize:"11px",padding:"5px 10px"}} onClick={()=>loadConfig(k)}>Ver</button>
                    {!isPreset&&<button style={{...S.btn("d"),fontSize:"11px",padding:"5px 10px"}} onClick={()=>{if(window.confirm("¿Borrar \""+cfg.name+"\"?"))deleteConfig(k)}}>Borrar</button>}
                  </div>
                </div>
              );
            })}
            <button style={{...S.btn("g"),marginTop:"10px",width:"100%"}} onClick={newConfig}>+ Nueva configuración</button>
          </div>
        );
      })()}

      {/* Editor de config */}
      <div style={S.card}>
        <div style={{color:gold,fontSize:"11px",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"10px"}}>{editKey?"Editando configuración":"Nueva configuración"}</div>
        {msg&&<div style={msg.startsWith("✓")?{...S.card,background:"#1a2a1a",border:"1px solid #2a5a2a",color:"#8e8",fontSize:"13px",marginBottom:"10px"}:S.alt("e")}>{msg}</div>}
        <label style={S.lbl}>Cancha</label>
        <select style={{...S.sel,marginBottom:"10px"}} value={courseId} onChange={e=>{setCourseId(e.target.value);setMsg("");}}>
          <option value="">Seleccioná una cancha</option>
          {COURSES.map(c=><option key={c.id} value={c.id}>{c.name} — {c.city}</option>)}
        </select>
        <label style={S.lbl}>Nombre de esta configuración</label>
        <input style={{...S.inp,marginBottom:"10px"}} placeholder="Ej: Cañuelas Roja, Hurlingham Azul..." value={cfgName} onChange={e=>{setCfgName(e.target.value);setMsg("");}}/>
        <label style={S.lbl}>Cantidad de hoyos</label>
        <input style={{...S.inp,marginBottom:"14px"}} type="number" min="1" max="36" value={numHoles} onChange={e=>setNumHoles(e.target.value)}/>

        {/* Tabla de hoyos */}
        <div style={{...S.card,background:"#141210",marginBottom:"12px",padding:"12px"}}>
          <div style={{color:"#b09050",fontSize:"10px",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"8px"}}>Par, distancia e índice por hoyo</div>
          <div style={{display:"grid",gridTemplateColumns:"32px 1fr 1fr 1fr",gap:"6px",marginBottom:"6px"}}>
            <div style={{color:"#b09050",fontSize:"10px",textTransform:"uppercase",textAlign:"center"}}>H</div>
            <div style={{color:"#b09050",fontSize:"10px",textTransform:"uppercase",textAlign:"center"}}>Par</div>
            <div style={{color:"#b09050",fontSize:"10px",textTransform:"uppercase",textAlign:"center"}}>Dist</div>
            <div style={{color:"#b09050",fontSize:"10px",textTransform:"uppercase",textAlign:"center"}}>Índice</div>
          </div>
          {Array.from({length:holeCount},(_,i)=>i+1).map(h=>{
            const d=hoyos[h]||{};
            const updH=(k,v)=>setHoyos(p=>({...p,[h]:{...(p[h]||{}),par:p[h]?.par||"",dist:p[h]?.dist||"",hcpIdx:p[h]?.hcpIdx||"",[k]:v}}));
            return(
              <div key={h} style={{display:"grid",gridTemplateColumns:"32px 1fr 1fr 1fr",gap:"6px",marginBottom:"4px",alignItems:"center"}}>
                <div style={{color:gold,fontSize:"12px",fontWeight:"bold",textAlign:"center"}}>{h}</div>
                <input style={{...S.inp,fontSize:"13px",padding:"6px",textAlign:"center"}} type="number" min="3" max="6" placeholder="—" value={d.par||""} onChange={e=>updH("par",e.target.value)}/>
                <input style={{...S.inp,fontSize:"13px",padding:"6px",textAlign:"center"}} type="number" min="0" max="999" placeholder="—" value={d.dist||""} onChange={e=>updH("dist",e.target.value)}/>
                <input style={{...S.inp,fontSize:"13px",padding:"6px",textAlign:"center"}} type="number" min="1" max="18" placeholder="—" value={d.hcpIdx||""} onChange={e=>updH("hcpIdx",e.target.value)}/>
              </div>
            );
          })}
        </div>

        <div style={{display:"flex",gap:"8px"}}>
          <button style={{...S.btn("p"),flex:1,padding:"11px"}} onClick={saveConfig}>💾 Guardar</button>
          {editKey&&<button style={{...S.btn("g"),padding:"11px"}} onClick={saveAs}>Guardar como...</button>}
        </div>
      </div>
    </div>
  );
}

function CoachPlayerStats({player}){
  const [filtro,setFiltro]=useState(null);
  const [selected,setSelected]=useState({});
  const allRounds=player.rounds.map(r=>({
    id:r.id,courseName:r.course_name||r.courseName,date:r.date,
    numHoles:r.num_holes||r.numHoles||18,
    totalShots:r.total_shots||r.totalShots||0,
    totalPutts:r.total_putts||r.totalPutts||0,
    totalChips:r.total_chips||r.totalChips||0,
    totalBunker:r.total_bunker||r.totalBunker||0,
    hcp:r.hcp||0,holes:r.holes||{}
  }));
  const holeCounts=[...new Set(allRounds.map(r=>r.numHoles||18))].sort((a,b)=>a-b);
  const activeFiltro=filtro??holeCounts[0]??null;
  function getFiltered(){
    if(activeFiltro==="seleccionar"){const sel=allRounds.filter(r=>selected[r.id]);return sel.length?sel:allRounds;}
    if(activeFiltro!=null)return allRounds.filter(r=>(r.numHoles||18)===activeFiltro);
    return allRounds;
  }
  const rounds=getFiltered();
  return(
    <div>
      {allRounds.length>0&&(
        <div style={{...S.card,marginBottom:"14px",padding:"12px"}}>
          <div style={{color:"#b09050",fontSize:"10px",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"8px"}}>Ver estadísticas de</div>
          <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
            {holeCounts.map(h=>(
              <button key={h} style={S.nb(activeFiltro===h)} onClick={()=>{setFiltro(h);setSelected({});}}>{h} hoyos</button>
            ))}
            <button style={S.nb(activeFiltro==="seleccionar")} onClick={()=>{setFiltro("seleccionar");setSelected({});}}>Seleccionar</button>
          </div>
          {filtro==="seleccionar"&&(
            <div style={{marginTop:"10px"}}>
              <div style={{color:"#b09050",fontSize:"10px",marginBottom:"7px"}}>Marcá las vueltas a incluir:</div>
              {allRounds.map(r=>(
                <label key={r.id} style={{display:"flex",alignItems:"center",gap:"10px",padding:"7px 0",borderBottom:"1px solid #3a3020",cursor:"pointer"}}>
                  <input type="checkbox" checked={!!selected[r.id]} onChange={e=>setSelected(p=>({...p,[r.id]:e.target.checked}))} style={{width:"16px",height:"16px",accentColor:gold}}/>
                  <div>
                    <div style={{color:"#f5ead0",fontSize:"12px"}}>{r.courseName||"Sin nombre"}</div>
                    <div style={{color:"#b09050",fontSize:"10px"}}>{r.date} · {r.numHoles} hoyos · {r.totalShots} golpes</div>
                  </div>
                </label>
              ))}
              {Object.values(selected).every(v=>!v)&&<div style={{color:"#b09050",fontSize:"11px",marginTop:"6px",fontStyle:"italic"}}>Sin selección → se muestran todas.</div>}
            </div>
          )}
        </div>
      )}
      <StatsView rounds={rounds} hcp={player.user.hcp} isCoach={true}/>
    </div>
  );
}

function CoachPassReset({username}){
  const [np,setNp]=useState("");
  const [msg,setMsg]=useState("");
  const [busy,setBusy]=useState(false);
  async function doReset(){
    if(!np.trim()){setMsg("Ingresá una nueva contraseña.");return;}
    setBusy(true);setMsg("");
    try{
      const ok=await sbPatch("users",{username},{"pass":np.trim()});
      if(!ok)throw new Error("patch failed");
      lsSet("pass:"+username,np.trim());
      setMsg("✓ Contraseña actualizada.");setNp("");
    }catch(e){setMsg("Error al guardar.");}
    finally{setBusy(false);}
  }
  return(
    <div style={{marginBottom:"14px"}}>
      <div style={{display:"flex",gap:"8px",marginBottom:"6px"}}>
        <input style={{...S.inp,flex:1}} type="text" placeholder="Nueva contraseña" value={np} onChange={e=>setNp(e.target.value)}/>
        <button style={S.btn("p")} onClick={doReset} disabled={busy}>{busy?"...":"Guardar"}</button>
      </div>
      {msg&&<div style={{fontSize:"12px",color:msg.startsWith("✓")?"#6a9a50":"#c04040"}}>{msg}</div>}
    </div>
  );
}

function ClaseActivaPanel({clase,clases,selJ,setSelJ,selH,setSelH,subTab,setSubTab,recStatus,setRecStatus,onUpdate,onFinalizar,onGuardar,lightMode,setLightMode,modoEdicion}){

  function updClase(fn){
    const next=JSON.parse(JSON.stringify(clase));fn(next);onUpdate(next);
  }
  function updHole(jIdx,hNum,k,v){
    updClase(c=>{
      if(!c.jugadores[jIdx].holes[hNum])c.jugadores[jIdx].holes[hNum]={};
      c.jugadores[jIdx].holes[hNum][k]=v;
    });
  }
  // updNota: campo puede ser "notaGeneral","resumenCoach", o zona mental "zona_N", o "notaLibre"
  function updNotaHoyo(jIdx,hNum,campo,texto){
    updClase(c=>{
      if(!c.jugadores[jIdx].notasHoyo)c.jugadores[jIdx].notasHoyo={};
      if(!c.jugadores[jIdx].notasHoyo[hNum])c.jugadores[jIdx].notasHoyo[hNum]={};
      c.jugadores[jIdx].notasHoyo[hNum][campo]=texto;
    });
  }
  function updPlanZona(jIdx,zona,texto){
    updClase(c=>{
      if(!c.jugadores[jIdx].planJuego)c.jugadores[jIdx].planJuego={};
      c.jugadores[jIdx].planJuego[zona]=texto;
    });
  }
  function startVoice(jIdx,campo,extra,modo){
    if(!navigator.onLine){alert("📶 Sin conexión — el micrófono requiere internet.");return;}
    if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
      alert("⚠️ Reconocimiento de voz no disponible en este dispositivo.");return;
    }
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const rec=new SR();
    rec.lang="es-AR";rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;
    // recKey debe coincidir con lo que pasa voiceBtn
    let recKey;
    if(modo==="plan"){recKey=`plan_eg_${jIdx}`; if(campo!=="estrategiaGlobal")recKey=`plan_z${campo.replace("zona_plan_","")}_${jIdx}`;}
    else if(extra!==undefined&&extra!==null){recKey=campo==="notaLibre"?`libre_${jIdx}_${extra}`:`z${campo.replace("zona_","")}_${jIdx}_${extra}`;}
    else recKey=`${campo==="resumenCoach"?"rc":campo==="notaGeneral"?"ng":campo}_${jIdx}`;
    setRecStatus(recKey);
    const timeout=setTimeout(()=>{try{rec.stop();}catch(e){}setRecStatus("error");setTimeout(()=>setRecStatus("idle"),2000);},10000);
    rec.onresult=e=>{
      clearTimeout(timeout);
      const txt=e.results[0][0].transcript;
      if(modo==="plan"){
        updPlanZona(jIdx,campo,(clase.jugadores[jIdx].planJuego?.[campo]||"")+(txt?" "+txt:""));
      } else if(extra!==undefined&&extra!==null){
        const prev=clase.jugadores[jIdx].notasHoyo?.[extra]?.[campo]||"";
        updNotaHoyo(jIdx,extra,campo,prev+(txt?" "+txt:""));
      } else if(campo==="resumenCoach"){
        updClase(c=>{c.jugadores[jIdx].resumenCoach=(c.jugadores[jIdx].resumenCoach||"")+(txt?" "+txt:"");});
      } else if(campo==="notaGeneral"){
        updClase(c=>{c.jugadores[jIdx].notaGeneral=(c.jugadores[jIdx].notaGeneral||"")+(txt?" "+txt:"");});
      }
      setRecStatus("done");setTimeout(()=>setRecStatus("idle"),2000);
    };
    rec.onerror=()=>{clearTimeout(timeout);setRecStatus("error");setTimeout(()=>setRecStatus("idle"),2000);};
    rec.start();
  }
  function finalizar(){
    const next=JSON.parse(JSON.stringify(clase));next.finalizada=true;onFinalizar(next);
  }
  function guardarBorrador(){
    const next=JSON.parse(JSON.stringify(clase));
    const arr=[...clases.filter(c=>c.id!==next.id),next];
    onGuardar(next,arr);
    alert("✓ Clase guardada. Podés salir y al volver la encontrás donde la dejaste.");
  }

  const L=lightMode;
  const bg=L?"#f5f0e8":"#0f0d0a";
  const cardBg=L?"#fff":"#1c1810";
  const cardBorder=L?"#d8cbb0":"#5a4a20";
  const txt=L?"#2a1a08":"#f5ead0";
  const txtMuted=L?"#7a5a20":"#b09050";
  const inpBg=L?"#f0e8d8":"#2a2318";
  const inpBorder=L?"#c0a060":"#7a6030";

  const SC={
    page:{minHeight:"100vh",background:bg,color:txt,padding:"18px 14px",maxWidth:"860px",margin:"0 auto"},
    card:{background:cardBg,border:`1px solid ${cardBorder}`,borderRadius:"6px",padding:"16px",marginBottom:"12px"},
    inp:{background:inpBg,border:`2px solid ${inpBorder}`,borderRadius:"4px",color:txt,padding:"10px 11px",fontSize:"15px",width:"100%",boxSizing:"border-box",outline:"none"},
    lbl:{fontSize:"12px",color:txtMuted,letterSpacing:"1px",textTransform:"uppercase",display:"block",marginBottom:"5px"},
    h2:{fontSize:"15px",color:gold,letterSpacing:"2px",textTransform:"uppercase",marginBottom:"14px",borderBottom:`1px solid ${cardBorder}`,paddingBottom:"7px"},
  };

  const j=clase.jugadores[selJ];
  const hNum=selH;
  const jCol=L?J_COLORS_LIGHT[selJ%4]:J_COLORS[selJ%4];

  return(
    <div style={SC.page}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px",flexWrap:"wrap",gap:"6px"}}>
        <div style={SC.h2}>Clase · {clase.fecha}</div>
        <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
          <button style={{background:L?"#e0d8c8":"#2d2720",color:L?"#5a3a10":"#f5ead0",border:`1px solid ${cardBorder}`,borderRadius:"4px",padding:"5px 9px",fontSize:"11px",cursor:"pointer"}}
            onClick={()=>setLightMode(!L)}>{L?"🌙 Oscuro":"☀️ Claro"}</button>
          <button style={{background:L?"#e0d8c8":"#2d2720",color:L?"#5a3a10":"#f5ead0",border:`1px solid ${cardBorder}`,borderRadius:"4px",padding:"5px 9px",fontSize:"11px",cursor:"pointer"}} onClick={guardarBorrador}>💾 Guardar</button>
          <button style={{background:`linear-gradient(135deg,${gold},#a8822a)`,color:"#1a1612",border:"none",borderRadius:"4px",padding:"5px 9px",fontSize:"11px",cursor:"pointer",fontWeight:"bold"}} onClick={finalizar}>{modoEdicion?"✓ Guardar y cerrar":"Finalizar →"}</button>
        </div>
      </div>

      {/* Selector jugador con color */}
      <div style={{display:"flex",gap:"5px",marginBottom:"10px",flexWrap:"wrap"}}>
        {clase.jugadores.map((jj,i)=>{
          const jc=L?J_COLORS_LIGHT[i%4]:J_COLORS[i%4];
          const act=selJ===i;
          return(
            <button key={i} onClick={()=>setSelJ(i)} style={{
              flex:1,minWidth:"70px",padding:"7px 5px",fontSize:"13px",fontWeight:act?"bold":"normal",
              background:act?jc.bg:(L?"#f0e8d8":"#1a1612"),
              color:act?jc.text:txtMuted,
              border:`2px solid ${act?jc.border:cardBorder}`,
              borderRadius:"6px",cursor:"pointer",
              boxShadow:act?`0 0 0 1px ${jc.dot}`:"none"
            }}>
              <span style={{display:"block",width:"8px",height:"8px",borderRadius:"50%",background:act?jc.dot:"transparent",display:"inline-block",marginRight:"5px"}}></span>

            </button>
          );

      </div>

      {/* Sub-tabs */}
      <div style={{display:"flex",gap:"5px",marginBottom:"10px",flexWrap:"wrap"}}>
        {[["tarjeta","Tarjeta"],["anotaciones","Anotaciones"],["plan","Plan Hoyo 0"],["resumen","Resumen"]].map(([t,l])=>(
          <button key={t} style={{
            background:subTab===t?gold:(L?"#e8e0d0":"transparent"),
            color:subTab===t?"#1a1612":(L?"#5a3a10":gold),
            border:`1px solid ${subTab===t?gold:cardBorder}`,
            borderRadius:"3px",padding:"6px 11px",fontSize:"11px",letterSpacing:"1px",textTransform:"uppercase",cursor:"pointer"

      </div>

      {/* Selector hoyo */}
      {subTab!=="plan"&&(
        <div style={{display:"flex",gap:"4px",marginBottom:"12px",flexWrap:"wrap"}}>
          {Array.from({length:clase.numHoles},(_,i)=>i+1).map(h=>{

      {subTab==="tarjeta"&&(()=>{

          <div style={SC.card}>
            <div style={{color:jCol.text,fontSize:"13px",letterSpacing:"2px",marginBottom:"12px",fontWeight:"bold"}}>HOYO {hNum} · {j.nombre} {j.apellido}</div>
            {/* Fila 1: golpes, putts, par */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"9px",marginBottom:"9px"}}>
              <div><div style={SC.lbl}>GOLPES</div>

              <div><div style={SC.lbl}>PUTTS</div>
                <input type="number" min="0" max="10" value={hd.putts||""} onChange={e=>updHole(selJ,hNum,"putts",e.target.value)} style={SC.inp} placeholder="—"/></div>
              <div><div style={SC.lbl}>PAR</div>

              const tirosG=Array.isArray(hd.tirosGreen)?hd.tirosGreen:[];

              function updTiro(i,k,v){updHole(selJ,hNum,"tirosGreen",tirosG.map((t,idx)=>idx===i?{...t,[k]:v}:t));}

                <div style={{borderTop:`1px solid ${L?"#ddd":"#3a3020"}`,paddingTop:"10px"}}>

                      <button onClick={addTiroG} style={{background:L?"#e8f0e0":"#2a3a20",color:L?"#3a6020":"#8aba60",border:`1px solid ${L?"#b0c890":"#4a6a30"}`,borderRadius:"4px",padding:"4px 12px",fontSize:"12px",cursor:"pointer"}}>+ Tiro</button>

                        <span style={{...SC.lbl,marginBottom:0}}>{i===0?"1° TIRO":`${i+1}° TIRO`}</span>
                        <button onClick={()=>remTiroG(i)} style={{background:L?"#f8e8e8":"#3a2020",color:L?"#c04040":"#e06060",border:`1px solid ${L?"#e0a0a0":"#6a3030"}`,borderRadius:"4px",padding:"3px 8px",fontSize:"12px",lineHeight:1,cursor:"pointer"}}>✕</button>
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px",marginBottom:"6px"}}>
                        <div>
                          <div style={SC.lbl}>DIST. (yds)</div>
                          <input type="number" min="0" max="600" value={t.dist||""} onChange={e=>updTiro(i,"dist",e.target.value)} style={SC.inp} placeholder="dist."/>
                        </div>
                        <div>
                          <div style={SC.lbl}>PALO</div>
                          <input type="text" value={t.palo||""} onChange={e=>updTiro(i,"palo",e.target.value.toUpperCase())} style={SC.inp} placeholder="7H, PW..."/>
                        </div>
                      </div>
                      <div>
                        <div style={SC.lbl}>RESULTADO</div>
                        <select value={t.resultado||""} onChange={e=>updTiro(i,"resultado",e.target.value)} style={SC.inp}>
                          <option value="">—</option>
                          <option value="green">🟢 Green</option>
                          <option value="chip">🟡 Zona chip</option>
                          <option value="bunker">🟤 Bunker</option>
                          <option value="corto">❌ Corto</option>
                          <option value="largo">❌ Largo</option>
                          <option value="lateral">❌ Lateral</option>
                        </select>
                      </div>
                    </div>
                  ))}
                </div>
              );
            })()}
          </div>
        );
      })()}

      {/* ── ANOTACIONES POR HOYO ── */}
      {subTab==="anotaciones"&&(()=>{
        const notasH=j.notasHoyo?.[hNum]||{};
        return(
          <div>
            <div style={{color:jCol.text,fontSize:"12px",letterSpacing:"1px",marginBottom:"10px",textTransform:"uppercase"}}>
              Anotaciones · Hoyo {hNum} · {j.nombre}
            </div>
            {ZONES.map((zona,zi)=>{
              const recKey=`z${zi}_${selJ}_${hNum}`;
              return(
                <div key={zona} style={{...SC.card,marginBottom:"8px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
                    <div style={{color:jCol.text,fontSize:"12px",fontWeight:"bold"}}>{zona}</div>
                    {voiceBtn(recStatus,recKey,()=>startVoice(selJ,"zona_"+zi,hNum),L)}
                  </div>
                  <textarea value={notasH["zona_"+zi]||""} onChange={e=>updNotaHoyo(selJ,hNum,"zona_"+zi,e.target.value)}
                    placeholder={`Observación — ${zona}...`}
                    style={{...SC.inp,minHeight:"60px",resize:"vertical",fontSize:"14px"}}/>
                </div>
              );
            })}
            {/* Campo libre */}
            <div style={SC.card}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
                <div style={{color:gold,fontSize:"12px",fontWeight:"bold"}}>Anotación libre</div>
                {voiceBtn(recStatus,`libre_${selJ}_${hNum}`,()=>startVoice(selJ,"notaLibre",hNum),L)}
              </div>
              <textarea value={notasH.notaLibre||""} onChange={e=>updNotaHoyo(selJ,hNum,"notaLibre",e.target.value)}
                placeholder="Notas libres del coach para este hoyo..."
                style={{...SC.inp,minHeight:"80px",resize:"vertical",fontSize:"14px"}}/>
            </div>
          </div>
        );
      })()}

      {/* ── PLAN HOYO 0 ── */}
      {subTab==="plan"&&(()=>{
        const plan=j.planJuego||{};
        return(
          <div>
            <div style={{...SC.card,background:L?"#f0ead0":(jCol.bg),border:`1px solid ${jCol.border}`,marginBottom:"12px"}}>
              <div style={{color:jCol.text,fontSize:"13px",fontWeight:"bold",marginBottom:"4px"}}>Plan de Juego · {j.nombre} {j.apellido}</div>
              <div style={{color:txtMuted,fontSize:"12px"}}>Completar antes de salir a la cancha. Define el proceso para cada zona mental.</div>
            </div>
            {ZONES.map((zona,zi)=>{
              const recKey=`plan_z${zi}_${selJ}`;
              return(
                <div key={zona} style={SC.card}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
                    <div style={{color:jCol.text,fontSize:"13px",fontWeight:"bold"}}>{zona}</div>
                    {voiceBtn(recStatus,recKey,()=>startVoice(selJ,"zona_plan_"+zi,null,"plan"),L)}
                  </div>
                  <textarea value={plan["zona_plan_"+zi]||""} onChange={e=>updPlanZona(selJ,"zona_plan_"+zi,e.target.value)}
                    placeholder={`Plan para ${zona}...`}
                    style={{...SC.inp,minHeight:"64px",resize:"vertical",fontSize:"14px"}}/>
                </div>
              );
            })}
            {/* Estrategia global */}
            <div style={SC.card}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
                <div style={{color:gold,fontSize:"13px",fontWeight:"bold"}}>Estrategia Global de Juego</div>
                {voiceBtn(recStatus,`plan_eg_${selJ}`,()=>startVoice(selJ,"estrategiaGlobal",null,"plan"),L)}
              </div>
              <textarea value={plan.estrategiaGlobal||""} onChange={e=>updPlanZona(selJ,"estrategiaGlobal",e.target.value)}
                placeholder="Estrategia general para la vuelta de hoy..."
                style={{...SC.inp,minHeight:"80px",resize:"vertical",fontSize:"14px"}}/>
            </div>
          </div>
        );
      })()}

      {/* ── RESUMEN DEL JUGADOR ── */}
      {subTab==="resumen"&&(
        <>
          <div style={{...SC.card,marginBottom:"10px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
              <div style={{color:gold,fontSize:"12px",letterSpacing:"1px",textTransform:"uppercase"}}>Nota General · {j.nombre}</div>
              {voiceBtn(recStatus,`ng_${selJ}`,()=>startVoice(selJ,"notaGeneral"),L)}
            </div>
            <textarea value={j.notaGeneral||""} onChange={e=>updClase(c=>{c.jugadores[selJ].notaGeneral=e.target.value;})}
              placeholder="Observaciones generales del jugador..."
              style={{...SC.inp,minHeight:"72px",resize:"vertical",fontSize:"14px"}}/>
          </div>
          <div style={{...SC.card,background:L?"#e8f0e0":(jCol.bg),border:`1px solid ${jCol.border}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
              <div style={{color:jCol.text,fontSize:"12px",letterSpacing:"1px",textTransform:"uppercase"}}>Resumen Coach · {j.nombre}</div>
              {voiceBtn(recStatus,`rc_${selJ}`,()=>startVoice(selJ,"resumenCoach"),L)}
            </div>
            <textarea value={j.resumenCoach||""} onChange={e=>updClase(c=>{c.jugadores[selJ].resumenCoach=e.target.value;})}
              placeholder="Resumen del coach para este jugador..."
              style={{...SC.inp,minHeight:"80px",resize:"vertical",fontSize:"14px",
                background:L?"#f0f5e8":"#182010",border:`2px solid ${jCol.border}`}}/>
          </div>
        </>
      )}
    </div>
  );
}

// ─── REPORTE CLASE ────────────────────────────────────────────────────────────
function ReporteClase({clase,onBack,onUpdate,lightMode,setLightMode,readOnly}){
  const [selJ,setSelJ]=useState(0);
  const [recStatus,setRecStatus]=useState("idle");
  const [verPlan,setVerPlan]=useState(false);
  const [verAnotaciones,setVerAnotaciones]=useState(true);
  const [previewHtml,setPreviewHtml]=useState(null);
  const [verTarjeta,setVerTarjeta]=useState(false);

  const L=lightMode||false;
  const bg=L?"#f5f0e8":"#0f0d0a";
  const cardBg=L?"#fff":"#1c1810";
  const cardBorder=L?"#d8cbb0":"#5a4a20";
  const txt=L?"#2a1a08":"#f5ead0";
  const txtMuted=L?"#7a5a20":"#b09050";
  const inpBg=L?"#f0e8d8":"#2a2318";
  const inpBorder=L?"#c0a060":"#7a6030";
  const SC={
    page:{minHeight:"100vh",background:bg,color:txt,padding:"18px 14px",maxWidth:"860px",margin:"0 auto"},
    card:{background:cardBg,border:`1px solid ${cardBorder}`,borderRadius:"6px",padding:"16px",marginBottom:"12px"},
    inp:{background:inpBg,border:`2px solid ${inpBorder}`,borderRadius:"4px",color:txt,padding:"10px 11px",fontSize:"15px",width:"100%",boxSizing:"border-box",outline:"none"},
    lbl:{fontSize:"12px",color:txtMuted,letterSpacing:"1px",textTransform:"uppercase",display:"block",marginBottom:"5px"},
  };

  function calcTotal(jIdx){
    return Object.values(clase.jugadores[jIdx].holes).reduce((s,h)=>s+(parseInt(h.shots)||0),0)||0;
  }
  function calcPutts(jIdx){
    return Object.values(clase.jugadores[jIdx].holes).reduce((s,h)=>s+(parseInt(h.putts)||0),0)||0;
  }
  function calcPenalidades(jIdx){
    return Object.values(clase.jugadores[jIdx].holes).reduce((s,h)=>s+(h.pen_ob?1:0)+(h.pen_agua?1:0)+(h.pen_perdida?1:0),0)||0;
  }
  function calcNeto(jIdx){
    const total=calcTotal(jIdx);
    if(!total)return null;
    const hcpProp=Math.ceil((clase.jugadores[jIdx].hcp||0)*clase.numHoles/18);
    return total-hcpProp;
  }
  function updJugador(jIdx,fn){
    if(!onUpdate)return;
    const next=JSON.parse(JSON.stringify(clase));
    fn(next.jugadores[jIdx]);
    onUpdate(next);
  }
  function startVoiceR(jIdx,campo){
    if(!navigator.onLine){alert("📶 Sin conexión — el micrófono requiere internet.");return;}
    if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert("⚠️ Reconocimiento de voz no disponible en este dispositivo.");return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const rec=new SR();
    rec.lang="es-AR";rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;
    setRecStatus(campo+"_"+jIdx);
    const timeout=setTimeout(()=>{try{rec.stop();}catch(e){}setRecStatus("error");setTimeout(()=>setRecStatus("idle"),2000);},10000);
    rec.onresult=e=>{
      clearTimeout(timeout);
      const txt2=e.results[0][0].transcript;
      updJugador(jIdx,j=>{j[campo]=(j[campo]||"")+(txt2?" "+txt2:"");});
      setRecStatus("done");setTimeout(()=>setRecStatus("idle"),2000);
    };
    rec.onerror=()=>{clearTimeout(timeout);setRecStatus("error");setTimeout(()=>setRecStatus("idle"),2000);};
    rec.start();
  }

  function calcStatsClase(jIdx){
    const holes=Object.values(clase.jugadores[jIdx].holes||{});
    const n=holes.filter(h=>parseInt(h.shots)>0).length;
    if(!n)return null;
    const totalPutts=holes.reduce((s,h)=>s+(parseInt(h.putts)||0),0);
    const totalChips=holes.reduce((s,h)=>s+(parseInt(h.chips)||0),0);
    const totalBunker=holes.reduce((s,h)=>s+(parseInt(h.bunker)||0),0);
    const avgPuttsH=n?(totalPutts/n).toFixed(2):"—";
    const avgChipsH=n?(totalChips/n).toFixed(2):"—";
    const avgBunkerH=n?(totalBunker/n).toFixed(2):"—";
    const dp1vals=holes.map(h=>parseFloat(h.distPutt1)).filter(v=>v>0);
    const avgDistPutt1=dp1vals.length?(dp1vals.reduce((a,b)=>a+b,0)/dp1vals.length).toFixed(1):"—";
    const sumDistPutt1=dp1vals.length?dp1vals.reduce((a,b)=>a+b,0).toFixed(1):"—";
    const tirosGreenAll=holes.flatMap(h=>Array.isArray(h.tirosGreen)?h.tirosGreen:[]);
    const tirosConDist=tirosGreenAll.filter(t=>parseFloat(t.dist)>0);
    const avgDistGreen=tirosConDist.length?(tirosConDist.reduce((s,t)=>s+parseFloat(t.dist),0)/tirosConDist.length).toFixed(1):"—";
    // GAPI: Green Alcanzado en Primer Intento — solo tirosGreen[0] por hoyo, con golpes jugados
    const hoyosConTiro=holes.filter(h=>parseInt(h.shots)>0&&Array.isArray(h.tirosGreen)&&h.tirosGreen.length>0);
    const gapiHoyos=hoyosConTiro.filter(h=>h.tirosGreen[0].resultado==="green");
    const gapiN=gapiHoyos.length;
    const gapiTotal=hoyosConTiro.length;
    // Dist. promedio primer tiro (todos los intentos)
    const distPrimerTiroVals=hoyosConTiro.map(h=>parseFloat(h.tirosGreen[0].dist)).filter(v=>v>0);
    const avgDistTodo=distPrimerTiroVals.length?(distPrimerTiroVals.reduce((a,b)=>a+b,0)/distPrimerTiroVals.length).toFixed(1):"—";
    // Dist. promedio primer tiro cuando acierta
    const distGapiVals=gapiHoyos.map(h=>parseFloat(h.tirosGreen[0].dist)).filter(v=>v>0);
    const avgDistGapi=distGapiVals.length?(distGapiVals.reduce((a,b)=>a+b,0)/distGapiVals.length).toFixed(1):"—";
    const pctGapi=gapiTotal>0?(gapiN+"/"+gapiTotal+" ("+Math.round(gapiN/gapiTotal*100)+"%)"):"—";
    const porPar={};
    [3,4,5].forEach(p=>{

                                  })} style={{background:"transparent",border:"none",color:txt,fontSize:"12px",width:"100%",minHeight:"48px",resize:"vertical",outline:"none",fontFamily:"Georgia,serif"}} placeholder="—"/>
                                ):(
                                  <span style={{color:txt,fontSize:"12px"}}>{nh["zona_"+zi]||<span style={{color:txtMuted}}>—</span>}</span>
                                )}

                              ):(

                              )}
                            </td>
                          </tr>
                        );
                      })}

                  </table>
                </div>
              )}
            </div>
          );
        })()}

          </div>
          <textarea value={j.resumenCoach||""} onChange={e=>!readOnly&&updJugador(selJ,jj=>{jj.resumenCoach=e.target.value;})}

            style={{...SC.inp,minHeight:"72px",resize:"vertical",fontSize:"14px",

        {/* Tarjeta de la cancha colapsable */}
